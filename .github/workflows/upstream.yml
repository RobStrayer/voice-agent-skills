name: upstream

# Weekly upkeep check. Detection is free: scripts/check_upstream.py compares
# content hashes (a moved upstream head with unchanged tracked files is not
# drift) and this job keeps ONE standing issue, "Upstream changes", up to date.
# It closes that issue when everything is clean. No AI runs here and nothing is
# committed; a maintainer decides what to do with the report.
#
# Two jobs, so the token that can write issues never runs third-party code:
#   check  (contents: read)  runs the comparison script and the link checker and
#                            hands their text over as an artifact;
#   report (issues: write)   checks out nothing, downloads that artifact and
#                            posts it with --body-file.
# Report and link-checker text is data. No run step interpolates workflow
# expressions, so upstream text can never become shell code.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'RBStrayer/nl-voice-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository; this job cannot write issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compare tracked upstream content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir handoff
          python scripts/check_upstream.py --out handoff/report.md
      - name: Check external links
        # 403 and 405 are accepted: many sites block bots (403) and MCP endpoints reject plain GETs (405).
        # Real rot (404, 410, 5xx, DNS and TLS failures) is still reported.
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Skip hosts that block bots and our own issues URLs until they exist.
          # 429 means rate limited, not broken.
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --accept '200..=299,403,405,429'
            --exclude '^https?://([a-z0-9-]+\.)*(pnas\.org|sec\.gov|gartner\.com|bloomberg\.com)(/|$)'
            --exclude '^https://github\.com/RBStrayer/nl-voice-skills/issues'
            './*.md' './docs/**/*.md'
          fail: false
          jobSummary: false
          output: handoff/lychee-out.md
      - name: Record the link checker exit code
        env:
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        run: printf '%s' "$LYCHEE_EXIT" > handoff/lychee-exit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-report
          path: handoff
          if-no-files-found: error
          retention-days: 7

  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # create the label, open, update and close the standing issue
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upstream-report
          path: ${{ runner.temp }}/handoff
      - name: Update the standing issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/handoff"
          body="$RUNNER_TEMP/body.md"
          lychee_exit=$(cat "$dir/lychee-exit")
          cp "$dir/report.md" "$body"
          if [ "$lychee_exit" != "0" ]; then
            {
              printf '\n## Broken external links\n\n'
              # iconv -c drops a character cut in half by the byte limit.
              if [ -f "$dir/lychee-out.md" ]; then head -c 15000 "$dir/lychee-out.md" | iconv -c -f UTF-8 -t UTF-8 || true; else echo 'The link checker produced no output.'; fi
            } >> "$body"
          fi
          # Keep the full text in the run log, with workflow commands switched off
          # so upstream text cannot issue any.
          stop=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$stop"
          cat "$body"
          echo "::$stop::"
          # GitHub rejects bodies over 65,536 characters; bytes are a safe upper bound.
          if [ "$(wc -c < "$body")" -gt 65000 ]; then
            { head -c 60000 "$body" | iconv -c -f UTF-8 -t UTF-8 || true
              printf '\n\n(truncated; the full text is in the workflow run log)\n'; } > "$body.cut"
            mv "$body.cut" "$body"
          fi
          gh label create upstream-drift --force --color FBCA04 \
            --description "Weekly upstream and link check" > /dev/null
          number=$(gh issue list --label upstream-drift --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          # Only the generated first line decides; upstream text can never be line 1.
          if [ "$(head -n 1 "$dir/report.md")" = '<!-- upstream-drift: clean -->' ] && [ "$lychee_exit" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Nothing to report this week: no upstream content changes and no broken external links."
            fi
          elif [ -n "$number" ]; then
            gh issue edit "$number" --title "Upstream changes" --body-file "$body"
          else
            gh issue create --title "Upstream changes" --label upstream-drift --body-file "$body"
          fi
