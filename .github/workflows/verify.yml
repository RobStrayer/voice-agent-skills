name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check sources, licenses, links and figures
        run: python scripts/verify.py
      - name: Check the verifier rejects bad input
        run: python scripts/test_verify.py
      - name: Check the upstream drift logic offline
        run: python scripts/test_check_upstream.py
