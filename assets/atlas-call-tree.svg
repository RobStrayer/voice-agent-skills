<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="atlas-call-tree-title atlas-call-tree-desc" id="atlas-call-tree-root">
<title id="atlas-call-tree-title">Call routing with ownership and recovery</title>
<desc id="atlas-call-tree-desc">Admit and route a caller to a service answer, authorized action, or human handoff. The action route distinguishes confirmed from unknown outcomes. A supported warm handoff retires only the bot after acceptance and connection; unavailable destinations retain the caller and offer fallback.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #atlas-call-tree-root { color: #23344b; font-family: 'Geist',system-ui,sans-serif; }
      #atlas-call-tree-root .diagram-container { width:100%;overflow-x:auto }
      #atlas-call-tree-root .title { font:600 22px 'Geist',system-ui,sans-serif;fill:#23344b }
      #atlas-call-tree-root .name { font:600 20px 'Geist',system-ui,sans-serif;fill:#23344b }
      #atlas-call-tree-root .body { font:400 18px 'Geist',system-ui,sans-serif;fill:#23344b }
      #atlas-call-tree-root .small { font:400 16px 'Geist',system-ui,sans-serif;fill:#50627a }
      #atlas-call-tree-root .mono { font:500 15px 'Geist Mono',Consolas,monospace;fill:#50627a }
      #atlas-call-tree-root .reverse { fill:#ffffff }
      #atlas-call-tree-root .blue { fill:#365f9c }
      #atlas-call-tree-root .teal { fill:#176d6a }
      #atlas-call-tree-root .amber { fill:#815313 }
      #atlas-call-tree-root .diagram-container { overflow-x:visible }</style>
<marker id="atlas-call-tree-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L8 4 L0 8Z" fill="#50627a"/>
</marker>
<pattern id="atlas-call-tree-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
<path d="M0 8L8 0" stroke="#b7c5d5" stroke-width="1"/>
</pattern>
</defs>
<rect x="0" y="0" width="960" height="472" rx="12" fill="#eef3f8" stroke="none" />
<text x="24" y="35" class="title">Three caller needs, with recovery beside each</text>
<text x="936" y="34" class="mono" text-anchor="end">Conceptual warm-handoff flow</text>
<rect x="24" y="188" width="150" height="80" rx="8" fill="#d9efeb" stroke="none" />
<rect x="24" y="188" width="4" height="80" rx="0" fill="#176d6a" stroke="none" />
<text x="40" y="219" class="name">Admit / route</text>
<text x="40" y="245" class="small">Caller retained</text>
<path d="M174 228 H214 V105 H252" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<path d="M174 228 H252" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<path d="M174 228 H214 V351 H252" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<rect x="258" y="65" width="218" height="80" rx="8" fill="#dce8f8" stroke="none" />
<rect x="258" y="65" width="4" height="80" rx="0" fill="#365f9c" stroke="none" />
<text x="274" y="96" class="name">Service question</text>
<text x="274" y="122" class="small">Answer from sources</text>
<rect x="258" y="188" width="218" height="80" rx="8" fill="#d9efeb" stroke="none" />
<rect x="258" y="188" width="4" height="80" rx="0" fill="#176d6a" stroke="none" />
<text x="274" y="219" class="name">Authorized action</text>
<text x="274" y="245" class="small">Validate + submit</text>
<rect x="258" y="311" width="218" height="80" rx="8" fill="#dce8f8" stroke="none" />
<rect x="258" y="311" width="4" height="80" rx="0" fill="#365f9c" stroke="none" />
<text x="274" y="342" class="name">Person requested</text>
<text x="274" y="368" class="small">Attempt supported handoff</text>
<line x1="476" y1="105" x2="550" y2="105" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<rect x="556" y="65" width="380" height="80" rx="8" fill="#dce8f8" stroke="none" />
<rect x="556" y="65" width="4" height="80" rx="0" fill="#365f9c" stroke="none" />
<text x="572" y="96" class="name">Answer + return to conversation</text>
<text x="572" y="122" class="small">Clarify when the answer is unclear</text>
<path d="M476 228 H514 V195 H550" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<path d="M476 228 H514 V270 H550" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<rect x="556" y="159" width="380" height="65" rx="8" fill="#d9efeb" stroke="none" />
<rect x="556" y="159" width="4" height="65" rx="0" fill="#176d6a" stroke="none" />
<text x="572" y="190" class="name">Confirmed result</text>
<text x="572" y="216" class="small">Report the established outcome</text>
<rect x="556" y="235" width="380" height="65" rx="8" fill="#f5e8ce" stroke="none" />
<rect x="556" y="235" width="4" height="65" rx="0" fill="#815313" stroke="none" />
<text x="572" y="266" class="name">Unknown result</text>
<text x="572" y="292" class="small">Keep the action; reconcile before retry</text>
<path d="M476 351 H514 V342 H550" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<path d="M476 351 H514 V417 H550" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#atlas-call-tree-arrow)"/>
<rect x="556" y="307" width="380" height="65" rx="8" fill="#d9efeb" stroke="none" />
<rect x="556" y="307" width="4" height="65" rx="0" fill="#176d6a" stroke="none" />
<text x="572" y="338" class="name">Accepted + connected</text>
<text x="572" y="364" class="small">Retire only the bot when supported</text>
<rect x="556" y="382" width="380" height="65" rx="8" fill="#f5e8ce" stroke="none" />
<rect x="556" y="382" width="4" height="65" rx="0" fill="#815313" stroke="none" />
<text x="572" y="413" class="name">Destination unavailable</text>
<text x="572" y="439" class="small">Retain caller + offer supported fallback</text>
</svg>
