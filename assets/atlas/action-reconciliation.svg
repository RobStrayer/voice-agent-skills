<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="action-reconciliation-title action-reconciliation-desc" id="action-reconciliation-root">
<title id="action-reconciliation-title">Corrected intent and durable action state</title>
<desc id="action-reconciliation-desc">The caller changes a Friday booking request to Monday after the original result is lost. Preserve corrected intent while checking action A. Committed, confirmed not committed, and still unknown outcomes require different recovery routes.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #action-reconciliation-root { color: #23344b; font-family: 'Geist',system-ui,sans-serif; }
      #action-reconciliation-root .diagram-container { width:100%;overflow-x:auto }
      #action-reconciliation-root .title { font:600 22px 'Geist',system-ui,sans-serif;fill:#23344b }
      #action-reconciliation-root .name { font:600 20px 'Geist',system-ui,sans-serif;fill:#23344b }
      #action-reconciliation-root .body { font:400 18px 'Geist',system-ui,sans-serif;fill:#23344b }
      #action-reconciliation-root .small { font:400 16px 'Geist',system-ui,sans-serif;fill:#50627a }
      #action-reconciliation-root .mono { font:500 15px 'Geist Mono',Consolas,monospace;fill:#50627a }
      #action-reconciliation-root .reverse { fill:#ffffff }
      #action-reconciliation-root .blue { fill:#365f9c }
      #action-reconciliation-root .teal { fill:#176d6a }
      #action-reconciliation-root .amber { fill:#815313 }
      #action-reconciliation-root .diagram-container { overflow-x:visible }</style>
<marker id="action-reconciliation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L8 4 L0 8Z" fill="#50627a"/>
</marker>
<pattern id="action-reconciliation-hatch" patternUnits="userSpaceOnUse" width="8" height="8">
<path d="M0 8L8 0" stroke="#b7c5d5" stroke-width="1"/>
</pattern>
</defs>
<rect x="0" y="0" width="960" height="350" rx="12" fill="#eef3f8" stroke="none" />
<text x="24" y="35" class="title">Keep the corrected intent and the original action</text>
<text x="936" y="34" class="mono" text-anchor="end">Synthetic booking example</text>
<rect x="24" y="73" width="272" height="91" rx="8" fill="#dce8f8" stroke="none" />
<text x="42" y="104" class="name">Caller: “Friday at two.”</text>
<text x="42" y="136" class="small">Action A submitted</text>
<rect x="24" y="184" width="272" height="91" rx="8" fill="#d9efeb" stroke="none" />
<text x="42" y="214" class="name">“Make it Monday.”</text>
<text x="42" y="246" class="small">Corrected intent retained</text>
<path d="M296 118 H330 V186 H360" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#action-reconciliation-arrow)"/>
<path d="M296 230 H330 V210 H360" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#action-reconciliation-arrow)"/>
<rect x="366" y="151" width="234" height="82" rx="8" fill="#f5e8ce" stroke="none" />
<rect x="366" y="151" width="4" height="82" rx="0" fill="#815313" stroke="none" />
<text x="382" y="182" class="name">Check action A</text>
<text x="382" y="208" class="small">Original key + arguments</text>
<text x="366" y="103" class="body">Friday response was lost.</text>
<text x="366" y="129" class="small">Stop stale speech; check the write.</text>
<path d="M600 192 H644 V107 H682" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#action-reconciliation-arrow)"/>
<path d="M600 192 H682" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#action-reconciliation-arrow)"/>
<path d="M600 192 H644 V277 H682" fill="none" stroke="#50627a" stroke-width="1.5" marker-end="url(#action-reconciliation-arrow)"/>
<rect x="688" y="66" width="248" height="70" rx="8" fill="#d9efeb" stroke="none" />
<rect x="688" y="66" width="4" height="70" rx="0" fill="#176d6a" stroke="none" />
<text x="704" y="97" class="name">Committed</text>
<text x="704" y="123" class="small">Authorized change workflow</text>
<rect x="688" y="151" width="248" height="70" rx="8" fill="#dce8f8" stroke="none" />
<rect x="688" y="151" width="4" height="70" rx="0" fill="#365f9c" stroke="none" />
<text x="704" y="182" class="name">Did not commit</text>
<text x="704" y="208" class="small">Validate corrected request</text>
<rect x="688" y="236" width="248" height="70" rx="8" fill="#f5e8ce" stroke="none" />
<rect x="688" y="236" width="4" height="70" rx="0" fill="#815313" stroke="none" />
<text x="704" y="267" class="name">Still unknown</text>
<text x="704" y="293" class="small">Reconcile / human recovery</text>
<text x="24" y="324" class="small">A temporarily empty lookup does not establish failure. Keep both records until the outcome is known.</text>
</svg>
