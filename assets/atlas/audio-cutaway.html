<title id="audio-cutaway-title">Capture, render reference and audio processing</title>
<desc id="audio-cutaway-desc">Playback leaks acoustically into microphone capture. A separate rendered-audio reference feeds acoustic echo cancellation. Optional enhancement precedes speech detection and recognition. The figure describes inputs and responsibilities, not a provider API.</desc>
