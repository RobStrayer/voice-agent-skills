<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caller, playback and action lifetimes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#23344b;font-family:'Geist',system-ui,sans-serif}main{max-width:960px;margin:auto;min-width:0}.diagram-container{width:100%;overflow-x:auto}svg{display:block;width:100%;min-width:960px;height:auto}
.title{font:600 22px 'Geist',system-ui,sans-serif;fill:#23344b}.name{font:600 20px 'Geist',system-ui,sans-serif;fill:#23344b}.body{font:400 18px 'Geist',system-ui,sans-serif;fill:#23344b}.small{font:400 16px 'Geist',system-ui,sans-serif;fill:#50627a}.mono{font:500 15px 'Geist Mono',Consolas,monospace;fill:#50627a}.reverse{fill:#ffffff}.blue{fill:#365f9c}.teal{fill:#176d6a}.amber{fill:#815313}
@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
</style>
</head>
<body>
<main>
<div class="diagram-container">
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="307" viewBox="0 0 960 307" role="img" aria-labelledby="conversation-score-title conversation-score-desc">
<title id="conversation-score-title">Caller, playback and action lifetimes</title>
<desc id="conversation-score-desc">The caller pauses within a sentence, continues, and then corrects Tuesday to Thursday. Accepted interruption stops old playback while action A remains pending. Positions show event ordering, not elapsed time.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L8 4 L0 8Z" fill="#50627a"/>
</marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
<path d="M0 8L8 0" stroke="#b7c5d5" stroke-width="1"/>
</pattern>
</defs>
<rect x="0" y="0" width="960" height="307" rx="12" fill="#eef3f8" stroke="none" />
<text x="24" y="35" class="title">A pause, a continuation, a correction</text>
<text x="936" y="34" class="mono" text-anchor="end">Ordering only, not a time scale</text>
<text x="24" y="104" class="name">Caller</text>
<text x="24" y="128" class="small">incoming words</text>
<text x="24" y="177" class="name">Playback</text>
<text x="24" y="201" class="small">audible response</text>
<text x="24" y="250" class="name">Action A</text>
<text x="24" y="274" class="small">external work</text>
<rect x="176" y="80" width="212" height="50" rx="8" fill="#dce8f8" stroke="none" />
<text x="192" y="112" class="body">“Book Tuesday…”</text>
<rect x="400" y="80" width="70" height="50" rx="8" fill="url(#hatch)" stroke="#b7c5d5" />
<text x="435" y="112" class="small" text-anchor="middle">pause</text>
<rect x="482" y="80" width="142" height="50" rx="8" fill="#dce8f8" stroke="none" />
<text x="498" y="112" class="body">“…at two.”</text>
<rect x="744" y="80" width="192" height="50" rx="8" fill="#d9efeb" stroke="none" />
<text x="760" y="112" class="body">“Thursday instead.”</text>
<rect x="624" y="153" width="108" height="50" rx="8" fill="#dce8f8" stroke="none" />
<text x="678" y="185" class="small" text-anchor="middle">Checking…</text>
<rect x="744" y="153" width="192" height="50" rx="8" fill="#ffffff" stroke="#b7c5d5" stroke-dasharray="5 4"/>
<text x="760" y="185" class="body">Old audio stops</text>
<rect x="624" y="226" width="312" height="50" rx="8" fill="#f5e8ce" stroke="none" />
<text x="640" y="257" class="body">A stays pending: reconcile it</text>
<line x1="736" y1="67" x2="736" y2="214" stroke="#176d6a" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="176" y="169" class="body">Wait for completion evidence.</text>
<text x="176" y="245" class="body">Interruption stops speech.</text>
<text x="176" y="270" class="small">It does not erase action history.</text>
</svg>
</div>
</main>
</body>
</html>
