<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 876" width="1080" height="876" role="img" aria-labelledby="t d">
<title id="t">Where voice agents go wrong</title>
<desc id="d">The twenty problems builders hit most, in four groups, each with a one-line fix. Numbers are the ranking from the guide; 1 to 5 are the most reported. The conversation: number 2, Knowing when they&#39;re done: Use an end-of-turn model, one turn owner; number 6, Caller trust: One real task, and an easy way to a person; number 9, Names, numbers and emails: Read back, then validate in code; number 11, Interruptions: Trigger on words, not noise; number 13, Echo and noise: Echo cancellation on the device or browser; number 14, Languages and accents: Pin the language and the model version. Actions and the phone: number 3, Phone plumbing: Test on real phone calls early; number 7, Tool calls mid-call: Speak first, make tools safe to repeat; number 15, Guardrails and security: Code checks before anything happens; number 18, Handing to a person: Route in code, pass a short summary; number 19, Voicemail and spam labels: Detect early, use verified numbers; number 20, Consent and disclosure: Say it&#39;s an AI, honour opt-outs. Choosing: number 4, Picking a platform: Compare on your own recorded calls; number 5, Cost versus the invoice: Add up every invoice, divide by minutes; number 12, One model or a pipeline: Pipeline for phones and heavy tool use. Running it: number 1, Latency callers hear: Measure from the call audio; number 8, Reliability at scale: Pin versions, roll upgrades out slowly; number 10, Seeing what happened: Record both sides on one clock; number 16, Tests that predict calls: Replay real calls after every change; number 17, APIs that change: Use dated model IDs, watch deprecations.</desc>
<!-- Edit freely. Each group is one card; each problem is a rank badge, a name and a one-line fix. Ranks 1-5 use the filled badge. -->
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--listen:#0b7a53;--think:#4a3aa7;--warn:#8a5c00}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--listen:#2fb784;--think:#a29af0;--warn:#d29922}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.h2{font-size:20px;font-weight:700}
.e-listen{fill:var(--listen)}.e-think{fill:var(--think)}.e-net{fill:var(--net)}.e-warn{fill:var(--warn)}
.bar-listen{fill:var(--listen)}.bar-think{fill:var(--think)}.bar-net{fill:var(--net)}.bar-warn{fill:var(--warn)}
.name{font-size:16px;font-weight:600}.fix{font-size:15px;fill:var(--ink2)}.legend{font-size:15px;fill:var(--ink2)}
.div{fill:none;stroke:var(--line)}
.rank{fill:var(--net-t);stroke:var(--line)}.rank-t{font-size:14px;font-weight:700;fill:var(--ink)}
.rank-top{fill:var(--ink)}.rank-top-t{font-size:14px;font-weight:700;fill:var(--card)}
</style>
<rect class="bg" x="0.5" y="0.5" width="1079" height="875" rx="16"/>
<text class="h1" x="32" y="50">Where voice agents go wrong</text>
<text class="sub" x="32" y="78">The twenty problems builders hit most, and the fix that usually helps.</text>
<g id="group-listen">
<clipPath id="clip-listen"><rect x="32" y="104" width="500.0" height="368" rx="14"/></clipPath>
<rect class="card" x="32" y="104" width="500.0" height="368" rx="14"/>
<rect class="bar-listen" x="32" y="104" width="500.0" height="5" clip-path="url(#clip-listen)"/>
<text class="eyebrow e-listen" x="54" y="138">THE CONVERSATION</text>
<text class="h2" x="54" y="162">Hearing the caller right</text>
<circle class="rank-top" cx="68" cy="202" r="14"/>
<text class="rank-top-t" x="68" y="207" text-anchor="middle">2</text>
<text class="name" x="94" y="198">Knowing when they&#39;re done</text>
<text class="fix" x="94" y="218">Use an end-of-turn model, one turn owner</text>
<path class="div" d="M54 226H510.0"/>
<circle class="rank" cx="68" cy="248" r="14"/>
<text class="rank-t" x="68" y="253" text-anchor="middle">6</text>
<text class="name" x="94" y="244">Caller trust</text>
<text class="fix" x="94" y="264">One real task, and an easy way to a person</text>
<path class="div" d="M54 272H510.0"/>
<circle class="rank" cx="68" cy="294" r="14"/>
<text class="rank-t" x="68" y="299" text-anchor="middle">9</text>
<text class="name" x="94" y="290">Names, numbers and emails</text>
<text class="fix" x="94" y="310">Read back, then validate in code</text>
<path class="div" d="M54 318H510.0"/>
<circle class="rank" cx="68" cy="340" r="14"/>
<text class="rank-t" x="68" y="345" text-anchor="middle">11</text>
<text class="name" x="94" y="336">Interruptions</text>
<text class="fix" x="94" y="356">Trigger on words, not noise</text>
<path class="div" d="M54 364H510.0"/>
<circle class="rank" cx="68" cy="386" r="14"/>
<text class="rank-t" x="68" y="391" text-anchor="middle">13</text>
<text class="name" x="94" y="382">Echo and noise</text>
<text class="fix" x="94" y="402">Echo cancellation on the device or browser</text>
<path class="div" d="M54 410H510.0"/>
<circle class="rank" cx="68" cy="432" r="14"/>
<text class="rank-t" x="68" y="437" text-anchor="middle">14</text>
<text class="name" x="94" y="428">Languages and accents</text>
<text class="fix" x="94" y="448">Pin the language and the model version</text>
</g>
<g id="group-think">
<clipPath id="clip-think"><rect x="548.0" y="104" width="500.0" height="368" rx="14"/></clipPath>
<rect class="card" x="548.0" y="104" width="500.0" height="368" rx="14"/>
<rect class="bar-think" x="548.0" y="104" width="500.0" height="5" clip-path="url(#clip-think)"/>
<text class="eyebrow e-think" x="570.0" y="138">ACTIONS AND THE PHONE</text>
<text class="h2" x="570.0" y="162">Doing things safely</text>
<circle class="rank-top" cx="584.0" cy="202" r="14"/>
<text class="rank-top-t" x="584.0" y="207" text-anchor="middle">3</text>
<text class="name" x="610.0" y="198">Phone plumbing</text>
<text class="fix" x="610.0" y="218">Test on real phone calls early</text>
<path class="div" d="M570.0 226H1026.0"/>
<circle class="rank" cx="584.0" cy="248" r="14"/>
<text class="rank-t" x="584.0" y="253" text-anchor="middle">7</text>
<text class="name" x="610.0" y="244">Tool calls mid-call</text>
<text class="fix" x="610.0" y="264">Speak first, make tools safe to repeat</text>
<path class="div" d="M570.0 272H1026.0"/>
<circle class="rank" cx="584.0" cy="294" r="14"/>
<text class="rank-t" x="584.0" y="299" text-anchor="middle">15</text>
<text class="name" x="610.0" y="290">Guardrails and security</text>
<text class="fix" x="610.0" y="310">Code checks before anything happens</text>
<path class="div" d="M570.0 318H1026.0"/>
<circle class="rank" cx="584.0" cy="340" r="14"/>
<text class="rank-t" x="584.0" y="345" text-anchor="middle">18</text>
<text class="name" x="610.0" y="336">Handing to a person</text>
<text class="fix" x="610.0" y="356">Route in code, pass a short summary</text>
<path class="div" d="M570.0 364H1026.0"/>
<circle class="rank" cx="584.0" cy="386" r="14"/>
<text class="rank-t" x="584.0" y="391" text-anchor="middle">19</text>
<text class="name" x="610.0" y="382">Voicemail and spam labels</text>
<text class="fix" x="610.0" y="402">Detect early, use verified numbers</text>
<path class="div" d="M570.0 410H1026.0"/>
<circle class="rank" cx="584.0" cy="432" r="14"/>
<text class="rank-t" x="584.0" y="437" text-anchor="middle">20</text>
<text class="name" x="610.0" y="428">Consent and disclosure</text>
<text class="fix" x="610.0" y="448">Say it&#39;s an AI, honour opt-outs</text>
</g>
<g id="group-net">
<clipPath id="clip-net"><rect x="32" y="488" width="500.0" height="322" rx="14"/></clipPath>
<rect class="card" x="32" y="488" width="500.0" height="322" rx="14"/>
<rect class="bar-net" x="32" y="488" width="500.0" height="5" clip-path="url(#clip-net)"/>
<text class="eyebrow e-net" x="54" y="522">CHOOSING</text>
<text class="h2" x="54" y="546">Picking the stack</text>
<circle class="rank-top" cx="68" cy="586" r="14"/>
<text class="rank-top-t" x="68" y="591" text-anchor="middle">4</text>
<text class="name" x="94" y="582">Picking a platform</text>
<text class="fix" x="94" y="602">Compare on your own recorded calls</text>
<path class="div" d="M54 610H510.0"/>
<circle class="rank-top" cx="68" cy="632" r="14"/>
<text class="rank-top-t" x="68" y="637" text-anchor="middle">5</text>
<text class="name" x="94" y="628">Cost versus the invoice</text>
<text class="fix" x="94" y="648">Add up every invoice, divide by minutes</text>
<path class="div" d="M54 656H510.0"/>
<circle class="rank" cx="68" cy="678" r="14"/>
<text class="rank-t" x="68" y="683" text-anchor="middle">12</text>
<text class="name" x="94" y="674">One model or a pipeline</text>
<text class="fix" x="94" y="694">Pipeline for phones and heavy tool use</text>
<text class="fix" x="54" y="788">Compare the options in the provider landscape guide.</text>
</g>
<g id="group-warn">
<clipPath id="clip-warn"><rect x="548.0" y="488" width="500.0" height="322" rx="14"/></clipPath>
<rect class="card" x="548.0" y="488" width="500.0" height="322" rx="14"/>
<rect class="bar-warn" x="548.0" y="488" width="500.0" height="5" clip-path="url(#clip-warn)"/>
<text class="eyebrow e-warn" x="570.0" y="522">RUNNING IT</text>
<text class="h2" x="570.0" y="546">Keeping it working</text>
<circle class="rank-top" cx="584.0" cy="586" r="14"/>
