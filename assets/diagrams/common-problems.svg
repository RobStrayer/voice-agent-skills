<text class="name" x="610.0" y="582">Latency callers hear</text>
<text class="fix" x="610.0" y="602">Measure from the call audio</text>
<path class="div" d="M570.0 610H1026.0"/>
<circle class="rank" cx="584.0" cy="632" r="14"/>
<text class="rank-t" x="584.0" y="637" text-anchor="middle">8</text>
<text class="name" x="610.0" y="628">Reliability at scale</text>
<text class="fix" x="610.0" y="648">Pin versions, roll upgrades out slowly</text>
<path class="div" d="M570.0 656H1026.0"/>
<circle class="rank" cx="584.0" cy="678" r="14"/>
<text class="rank-t" x="584.0" y="683" text-anchor="middle">10</text>
<text class="name" x="610.0" y="674">Seeing what happened</text>
<text class="fix" x="610.0" y="694">Record both sides on one clock</text>
<path class="div" d="M570.0 702H1026.0"/>
<circle class="rank" cx="584.0" cy="724" r="14"/>
<text class="rank-t" x="584.0" y="729" text-anchor="middle">16</text>
<text class="name" x="610.0" y="720">Tests that predict calls</text>
<text class="fix" x="610.0" y="740">Replay real calls after every change</text>
<path class="div" d="M570.0 748H1026.0"/>
<circle class="rank" cx="584.0" cy="770" r="14"/>
<text class="rank-t" x="584.0" y="775" text-anchor="middle">17</text>
<text class="name" x="610.0" y="766">APIs that change</text>
<text class="fix" x="610.0" y="786">Use dated model IDs, watch deprecations</text>
</g>
<circle class="rank-top" cx="46" cy="841" r="11"/>
<text class="legend" x="66" y="846">The five problems builders report most</text>
