<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d">
<title id="t">Clean audio in, before the model hears it</title>
<desc id="d">Four sounds reach the microphone: the caller's voice, which you want to keep; background noise such as TV or traffic; other people talking; and the agent's own voice leaking from the speaker, which is echo. The microphone signal then passes through four stages in order: echo cancellation, noise suppression, voice activity detection and speech-to-text. A separate line carries a reference copy of what was played from the agent's speaker into echo cancellation, because it needs that copy to work. A warning inside noise suppression says aggressive suppression can delete quiet words like no. A note on where this runs: on the device or browser, which sees both the microphone and the speaker, so it can cancel echo; on your server, which gets only what the device sends and cannot cancel echo without the playback reference; and on phone calls, which add carrier processing and often 8 kilohertz narrowband audio.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--listen:#0b7a53;--listen-t:#dff3ea;--think:#4a3aa7;--think-t:#eae8f8;--speak:#b3441a;--speak-t:#fbe9e0;--warn:#8a5c00;--warn-t:#fff8c5}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--listen:#2fb784;--listen-t:#12301f;--think:#a29af0;--think-t:#262045;--speak:#ec7a45;--speak-t:#3a2014;--warn:#d29922;--warn-t:#2e2508}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:var(--ink2)}
.name{font-size:16px;font-weight:600}.body{font-size:15px}.desc{font-size:15px;fill:var(--ink2)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.flow{fill:none;stroke:var(--ink2);stroke-width:2}.lead{fill:none;stroke:var(--ink2);stroke-width:1.5}.ah{fill:var(--ink2)}
.ref{fill:none;stroke:var(--speak);stroke-width:2.5}.ahs{fill:var(--speak)}.rule{fill:none;stroke:var(--line)}
.s-listen{stroke:var(--listen)}.s-speak{stroke:var(--speak)}.s-net{stroke:var(--net)}.s-warn{stroke:var(--warn)}
.t-listen{fill:var(--listen-t)}.t-speak{fill:var(--speak-t)}.t-net{fill:var(--net-t)}.t-warn{fill:var(--warn-t)}
.blk{stroke-width:1.5}.disc{fill:var(--card)}.chip{fill:var(--net-t);stroke:var(--line)}
.strip{fill:var(--warn-t);stroke:var(--warn);stroke-width:1.25}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahs"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="639" rx="16"/>
<text class="h1" x="32" y="50">Clean audio in, before the model hears it</text>
<text class="sub" x="32" y="78">The microphone hears more than the caller. A typical chain removes echo and noise before it finds and transcribes speech.</text>

<text class="eyebrow" x="32" y="118">IN THE MICROPHONE</text>
<text class="eyebrow" x="414" y="118">CLEAN-UP, IN ORDER</text>
<text class="eyebrow" x="762" y="118">WHERE IT RUNS</text>

<!-- ===== sources ===== -->
<rect class="t-speak s-speak blk" x="32" y="132" width="236" height="84" rx="12"/>
<circle class="disc" cx="64" cy="174" r="18"/>
<g class="ico s-speak" transform="translate(53 163) scale(.92)"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g>
<text class="name" x="92" y="162">Agent's own voice</text><text class="desc" x="92" y="183">Echo: it leaks from the</text><text class="desc" x="92" y="202">speaker into the mic.</text>

<rect class="t-listen s-listen blk" x="32" y="230" width="236" height="84" rx="12"/>
<circle class="disc" cx="64" cy="272" r="18"/>
<g class="ico s-listen" transform="translate(53 261) scale(.92)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 7 0 0 1 16 0"/></g>
<text class="name" x="92" y="260">Caller's voice</text><text class="desc" x="92" y="281">The signal you want,</text><text class="desc" x="92" y="300">so keep it intact.</text>

<rect class="t-net s-net blk" x="32" y="328" width="236" height="84" rx="12"/>
<circle class="disc" cx="64" cy="370" r="18"/>
<g class="ico s-net" transform="translate(53 359) scale(.92)"><path d="M3 9q2.25-3 4.5 0t4.5 0t4.5 0t4.5 0M3 15q2.25-3 4.5 0t4.5 0t4.5 0t4.5 0"/></g>
<text class="name" x="92" y="358">Background noise</text><text class="desc" x="92" y="379">Steady or sudden:</text><text class="desc" x="92" y="398">TV, traffic, a fan.</text>

<rect class="t-net s-net blk" x="32" y="426" width="236" height="84" rx="12"/>
<circle class="disc" cx="64" cy="468" r="18"/>
<g class="ico s-net" transform="translate(53 457) scale(.92)"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2a4.8 4.8 0 0 1 4.5 5.8"/></g>
<text class="name" x="92" y="456">Other people talking</text><text class="desc" x="92" y="477">Hard to filter out:</text><text class="desc" x="92" y="496">it sounds like speech.</text>

<!-- all four reach the microphone -->
<path class="lead" d="M278 468V194"/>
<path class="lead" d="M268 272H278M268 370H278M268 468H278"/>
<path class="lead" d="M268 194H315" marker-end="url(#a)"/>
<circle class="chip" cx="338" cy="194" r="18"/>
<g class="ico s-net" transform="translate(329 185) scale(.75)"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
<text class="name" x="338" y="232" text-anchor="middle">Microphone</text>
<path class="flow" d="M356 194H411" marker-end="url(#a)"/>

<!-- reference copy of what was played -->
<path class="ref" d="M268 146H411" marker-end="url(#as)"/>
<text class="mono" x="340" y="137" text-anchor="middle">reference copy</text>

<!-- ===== chain ===== -->
<rect class="t-listen s-listen blk" x="414" y="132" width="320" height="84" rx="12"/>
<circle class="disc" cx="444" cy="164" r="17"/>
<g class="ico s-listen" transform="translate(433 153) scale(.92)"><path d="M8 8.5a5 5 0 0 1 0 7M12.5 5.5a9 9 0 0 1 0 13M17 2.5a13 13 0 0 1 0 19"/></g>
<text class="name" x="472" y="162">Echo cancellation</text>
<text class="desc" x="472" y="184">Removes the agent's own voice.</text>
<text class="desc" x="472" y="203">Needs a copy of what was played.</text>
<path class="flow" d="M444 218V239" marker-end="url(#a)"/><text class="mono" x="458" y="234">echo removed</text>

<rect class="t-listen s-listen blk" x="414" y="242" width="320" height="146" rx="12"/>
<circle class="disc" cx="444" cy="274" r="17"/>
<g class="ico s-listen" transform="translate(433 263) scale(.92)"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></g>
<text class="name" x="472" y="272">Noise suppression</text>
<text class="desc" x="472" y="294">Fades steady noise like traffic.</text>
<text class="desc" x="472" y="313">Voices may need speaker isolation.</text>
<rect class="strip" x="426" y="326" width="296" height="50" rx="8"/>
<g class="ico s-warn" transform="translate(436 340) scale(.83)"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></g>
<text class="body" x="464" y="346">Aggressive suppression can delete</text>
<text class="body" x="464" y="365">quiet words like “no”.</text>
<path class="flow" d="M444 390V411" marker-end="url(#a)"/><text class="mono" x="458" y="406">noise reduced</text>

<rect class="t-listen s-listen blk" x="414" y="414" width="320" height="66" rx="12"/>
<circle class="disc" cx="444" cy="447" r="17"/>
<g class="ico s-listen" transform="translate(433 436) scale(.92)"><path d="M2 12h4l3-7 4 14 3-7h6"/></g>
<text class="name" x="472" y="444">Voice activity detection</text>
<text class="desc" x="472" y="466">Finds when someone is talking.</text>
<path class="flow" d="M444 482V503" marker-end="url(#a)"/><text class="mono" x="458" y="498">speech start and end</text>

<rect class="t-listen s-listen blk" x="414" y="506" width="320" height="66" rx="12"/>
<circle class="disc" cx="444" cy="539" r="17"/>
<g class="ico s-listen" transform="translate(433 528) scale(.92)"><path d="M4 6h16M4 12h16M4 18h10"/></g>
<text class="name" x="472" y="536">Speech-to-text</text>
<text class="desc" x="472" y="558">Turns clean audio into words.</text>
<path class="flow" d="M444 574V601" marker-end="url(#a)"/><text class="mono" x="458" y="594">words for the model</text>

<!-- ===== where it runs ===== -->
<rect class="card" x="762.5" y="132.5" width="285" height="378" rx="14"/>
<g class="ico s-net" transform="translate(786 157) scale(.75)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
<text class="name" x="812" y="172">On the device or browser</text>
<text class="desc" x="786" y="196">Sees the microphone and the</text>
<text class="desc" x="786" y="215">speaker, so it can cancel echo</text>
<text class="desc" x="786" y="234">before audio is sent.</text>
<path class="rule" d="M786 254.5H1024"/>
<g class="ico s-net" transform="translate(786 274) scale(.75)"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></g>
<text class="name" x="812" y="289">On your server</text>
<text class="desc" x="786" y="313">Gets only what the device sends.</text>
<text class="desc" x="786" y="332">Without the playback reference</text>
<text class="desc" x="786" y="351">it can't cancel echo.</text>
<path class="rule" d="M786 371.5H1024"/>
<g class="ico s-net" transform="translate(786 391) scale(.75)"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></g>
<text class="name" x="812" y="406">On a phone call</text>
<text class="desc" x="786" y="430">Adds carrier processing, and the</text>
<text class="desc" x="786" y="449">audio is often 8 kHz narrowband.</text>
<text class="desc" x="786" y="468">Upsampling can't bring back</text>
<text class="desc" x="786" y="487">what was lost.</text>
</svg>
