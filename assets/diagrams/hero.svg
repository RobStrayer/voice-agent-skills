<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 424" width="1280" height="424" role="img" aria-labelledby="t d">
<title id="t">Voice Agent Skills</title>
<desc id="d">Banner for Voice Agent Skills: skills, guides and diagrams for building AI voice agents people enjoy talking to. A sound wave runs from left to right through the three stages of a voice agent. Listen: uneven green bars, like a caller's speech. Think: a steady band of violet dots while the agent decides. Speak: smooth orange bars that build to a peak, the agent's reply.</desc>
<!-- Edit freely. The wave is plain <rect> bars and <circle> dots on a 12 px grid, centred on y=262: change a bar's y and height to reshape it.
     The number in each bar's style attribute is the order the one-time sweep visits it. The sweep only runs when the viewer has not asked for reduced motion. -->
<style>
svg{--bg:#f6f8fa;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--listen:#0b7a53;--think:#4a3aa7;--speak:#b3441a}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--listen:#2fb784;--think:#a29af0;--speak:#ec7a45}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}
.word{font-size:88px;font-weight:700;letter-spacing:-2px}
.tag{font-size:24px;fill:var(--ink2)}
.lab{font-size:20px;font-weight:700;letter-spacing:2.4px}
.l{fill:var(--listen)}.t{fill:var(--think)}.s{fill:var(--speak)}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-l{stroke:var(--listen)}.s-t{stroke:var(--think)}.s-s{stroke:var(--speak)}
.rule{fill:none;stroke-width:3;stroke-linecap:round}
/* One soft swell passes through listen, think, speak once after load, then everything rests.
   The first and last frames are the designed shape. */
@media (prefers-reduced-motion:no-preference){
.l rect,.s rect,.t g{transform-box:fill-box;transform-origin:center;animation:sw 1s ease-in-out calc(.5s + var(--g)*.03s) 1}
.t g{animation-name:sd}
@keyframes sw{35%{transform:scaleY(1.15)}70%{transform:scaleY(.94)}}
@keyframes sd{40%{transform:scale(1.25)}}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="1279" height="423" rx="16"/>

<text class="word" x="640" y="126" text-anchor="middle">Voice Agent Skills</text>
<text class="tag" x="640" y="168" text-anchor="middle">Skills, guides and diagrams for building AI voice agents people enjoy talking to.</text>

