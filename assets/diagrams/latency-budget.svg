<rect class="wave-agent" x="986.1" y="149.0" width="4" height="14" rx="2"/>
<rect class="wave-agent" x="995.9" y="146.0" width="4" height="20" rx="2"/>
<text class="eyebrow e-listen" x="56" y="208">LISTEN</text>
<text class="name" x="56" y="230">Wait for end of turn</text>
<rect class="b-listen" x="377.8" y="203.0" width="134.8" height="22" rx="4"/>
<text class="mono ink2" x="522.6" y="219.0">260 ms</text>
<text class="eyebrow e-think" x="56" y="266">THINK</text>
<text class="name" x="56" y="288">Model writes a first phrase</text>
<rect class="b-think" x="512.6" y="261.0" width="238.5" height="22" rx="4"/>
<text class="mono ink2" x="761.1" y="277.0">+460 ms</text>
<text class="eyebrow e-speak" x="56" y="324">SPEAK</text>
<text class="name" x="56" y="346">Make audio, then send it</text>
<rect class="b-speak" x="751.1" y="319.0" width="93.3" height="22" rx="4"/>
<rect class="b-speak-t" x="846.4" y="319.0" width="24.0" height="22" rx="4"/>
<text class="mono ink2" x="880.4" y="335.0">+230 ms</text>
<text class="eyebrow e-net" x="56" y="382">DEVICE</text>
<text class="name" x="56" y="404">Buffer, then play</text>
<rect class="b-net" x="870.4" y="377.0" width="57.0" height="22" rx="4"/>
<text class="mono ink2" x="937.4" y="393.0">+110 ms</text>
<text class="small ink2" x="845.4" y="358.0" text-anchor="middle">first chunk</text>
<path class="brace" d="M377.8 468V478H958.5V468"/>
<path class="brace-tick" d="M927.4 472V478"/>
<text class="total" x="668.15" y="504" text-anchor="middle">1,120 ms until the caller hears a useful answer</text>
<text class="small ink2" x="668.15" y="526" text-anchor="middle">First sound at 1,060 ms. A filler like “one moment” is not the answer.</text>
<text class="foot" x="56" y="572">Stages can overlap: recognition runs while the caller talks, and later audio is made while earlier audio plays.</text>
<text class="foot" x="56" y="596">Measure end to end on real calls. Adding up each stage’s p95 does not give you the end-to-end p95.</text>
</svg>
