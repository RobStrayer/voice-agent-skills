<rect class="wave-caller" x="333.8" y="143.0" width="4" height="26" rx="2"/>
<rect class="wave-caller" x="341.0" y="149.0" width="4" height="14" rx="2"/>
<rect class="wave-caller" x="348.1" y="146.0" width="4" height="20" rx="2"/>
<rect class="wave-caller" x="355.3" y="151.0" width="4" height="10" rx="2"/>
<rect class="wave-caller" x="362.4" y="148.0" width="4" height="16" rx="2"/>
<rect class="wave-caller" x="369.6" y="152.0" width="4" height="8" rx="2"/>
<path class="silence" d="M383.8 156H921.4"/>
<rect class="pill" x="568.6" y="142" width="168" height="28" rx="14"/>
<text class="mono ink2" x="652.6" y="161" text-anchor="middle">1,060 ms silence</text>
<rect class="wave-filler" x="927.5" y="151.0" width="4" height="10" rx="2"/>
<rect class="wave-filler" x="937.3" y="147.0" width="4" height="18" rx="2"/>
<rect class="wave-filler" x="947.0" y="150.0" width="4" height="12" rx="2"/>
<rect class="wave-agent" x="956.8" y="145.0" width="4" height="22" rx="2"/>
