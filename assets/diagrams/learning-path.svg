<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 663" width="1080" height="663" role="img" aria-labelledby="t d">
<title id="t">Level up, one step at a time</title>
<desc id="d">Four levels of learning to build voice agents, drawn as a staircase that rises from left to right, each with skills from this repository. Level 1, Talk to it: get an agent talking in your browser on a managed platform or a quickstart, and learn the listen, think, speak loop. Skill: voice-stack-selection. Level 2, Put it to work: give it a phone number, tools and APIs and a real task such as booking, and learn prompts for voice, turn taking, interruptions and phone rules. Skills: voice-conversation-design, voice-turn-taking, voice-phone-compliance. Level 3, Own the pipeline: build on a framework like LiveKit Agents or Pipecat and pick your own speech-to-text, language model and text-to-speech, and learn latency, audio quality and telephony. Skills: voice-speech-pipeline, voice-latency-audit, voice-audio-frontends, voice-media-debugging. Level 4, Run it for real: test it with evals, watch it with monitoring and keep it reliable when real callers depend on it, and learn reliability, security and cost at scale. Skills: voice-agent-evaluation, voice-call-reliability, voice-agent-security, voice-cost-estimation.</desc>
<!-- Edit freely. Each level is one group: card, level badge, text, then skill chips pinned to the floor.
     Chip text uses textLength so every chip is the same width in any monospace font. If you rename a skill, set textLength to its character count times 7.9 and the chip width to that plus 20.
     To add a chip, make that card taller (move its top edge up) and keep the floor where it is. -->
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net-t:#eaeef2;--off:#c2cad2;--r1:#aeb8c3;--r2:#858f9b;--r3:#57606a;--r4:#1f2328;--listen:#0b7a53;--think:#4a3aa7;--speak:#b3441a}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net-t:#21262d;--off:#484f58;--r1:#3d444d;--r2:#626b77;--r3:#8b949e;--r4:#e6edf3;--listen:#2fb784;--think:#a29af0;--speak:#ec7a45}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:var(--ink2)}.h2{font-size:20px;font-weight:700}
.body{font-size:15px}.body2{font-size:15px;fill:var(--ink2)}
.div{fill:none;stroke:var(--line)}
.on{fill:var(--ink)}.off{fill:var(--off)}.badge{fill:var(--net-t)}
.r1{fill:var(--r1)}.r2{fill:var(--r2)}.r3{fill:var(--r3)}.r4{fill:var(--r4)}
.d-listen{fill:var(--listen)}.d-think{fill:var(--think)}.d-speak{fill:var(--speak)}
.chip{fill:var(--net-t);stroke:var(--line)}
.floor{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round}
</style>
<rect class="bg" x="0.5" y="0.5" width="1079" height="662" rx="16"/>
<text class="h1" x="32" y="50">Level up, one step at a time</text>
<text class="sub" x="32" y="78">Start at the level that fits you. Each one lists the skills in this repo that help.</text>

