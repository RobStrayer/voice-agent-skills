<circle class="d-speak" cx="179.89999999999998" cy="529" r="4"/>
<text class="body2" x="189.89999999999998" y="534">speak</text>
<path class="div" d="M46 551H266"/>
<text class="eyebrow" x="46" y="576">SKILLS</text>
<rect class="chip" x="46" y="589" width="185.9" height="28" rx="14"/>
<text class="mono" x="56" y="608" textLength="165.9" lengthAdjust="spacing">voice-stack-selection</text>
