<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 670" width="1080" height="670" role="img" aria-labelledby="t d">
<title id="t">What's worth building</title>
<desc id="d">A grid of voice agent use cases by difficulty (easy 2 to very hard 5, left to right) and value (very high 5 at the top to low 2 at the bottom). The start-here zone covers easy to medium difficulty with medium to high value: oral exams (easy, medium value); small-business front desk, restaurant phones, and speed-to-lead call-backs (medium, medium); AI-led interviews, language tutoring and freight check calls (medium, high). Outside it: reselling agents to local firms (easy, low, avoid at first); calls made for you (medium, low); companions and toys (hard, medium, avoid at first), accessibility and government 311 and 911 (hard, medium); bank and telco service (hard, high); healthcare front desk (hard, very high); outbound cold calling (very hard, low, avoid at first); debt collection and in-car assistants (very hard, medium, both avoid at first); drive-thru ordering (very hard, high, avoid at first). Ratings are judgements from public reports, not measurements.</desc>
<!-- Edit freely. Each use case is one dot plus a label inside its grid cell; move it by changing its (difficulty, value) key in the generator or by editing x/y here. -->
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--listen:#0b7a53;--listen-t:#dff3ea;--think:#4a3aa7;--warn:#8a5c00}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--listen:#2fb784;--listen-t:#12301f;--think:#a29af0;--warn:#d29922}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.grid-box{fill:var(--card);stroke:var(--line)}.grid{stroke:var(--line)}
.zone{fill:var(--listen-t)}.zone-edge{fill:none;stroke:var(--listen);stroke-width:2;stroke-dasharray:6 5}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.e-listen{fill:var(--listen)}
.axis{font-size:15px;font-weight:600}.n{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-weight:400;fill:var(--ink2)}
.axis-title{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:var(--ink2)}
.item{font-size:15px}.legend{font-size:15px}.note{font-size:15px;fill:var(--ink2)}
.dot{fill:var(--think)}.ring{fill:none;stroke:var(--warn);stroke-width:2.5}
</style>
<rect class="bg" x="0.5" y="0.5" width="1079" height="669" rx="16"/>
<text class="h1" x="32" y="50">What's worth building</text>
<text class="sub" x="32" y="78">Use cases by difficulty and value, from reports up to September 2026. Start in the green zone.</text>
