<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 528" width="1080" height="528" role="img" aria-labelledby="t d">
<title id="t">Trust boundaries in a live voice call</title>
<desc id="d">Three security zones from left to right. Left, untrusted inputs: caller speech and background voices, spoofable Caller ID and SIP headers, DTMF digits, and retrieved external text. Center, session edge: browser or phone transport receives only short-lived session tokens while the language model proposes tool calls from untrusted transcripts. Right, trusted server policy gate: deterministic code checks verified session identity, tool allowlists, rate and spend caps, and explicit confirmation before running external tools or transfers.</desc>
<defs>
  <marker id="arr-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1L9 5L1 9Z" fill="var(--net)"/>
  </marker>
  <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M1 1L9 5L1 9Z" fill="var(--listen)"/>
  </marker>
</defs>
<style>
svg{--bg:#f6f8fa;--card:#ffffff;--card2:#f0f3f6;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--listen:#0b7a53;--listen-bg:#dafbe1;--think:#4a3aa7;--think-bg:#edeaff;--speak:#b3441a;--speak-bg:#ffedd5;--net:#57606a;--danger:#cf222e;--danger-bg:#ffebe9}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--card2:#21262d;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--listen:#2fb784;--listen-bg:#0f2d22;--think:#a29af0;--think-bg:#221d42;--speak:#ec7a45;--speak-bg:#361d12;--net:#8b949e;--danger:#f85149;--danger-bg:#381417}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px}
.bg{fill:var(--bg);stroke:var(--line)}
.card{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.subcard{fill:var(--card2);stroke:var(--line);stroke-width:1}
.h1{font-size:26px;font-weight:700}
.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.3px}
.title{font-size:17px;font-weight:700}
.body{font-size:15px}
.small{font-size:14px;fill:var(--ink2)}
.foot{font-size:14.5px;fill:var(--ink2)}
.c-listen{fill:var(--listen)}.c-think{fill:var(--think)}.c-speak{fill:var(--speak)}.c-danger{fill:var(--danger)}
.b-listen{fill:var(--listen-bg);stroke:var(--listen);stroke-width:1.5}
.b-think{fill:var(--think-bg);stroke:var(--think);stroke-width:1.5}
.b-speak{fill:var(--speak-bg);stroke:var(--speak);stroke-width:1.5}
.b-danger{fill:var(--danger-bg);stroke:var(--danger);stroke-width:1.5;stroke-dasharray:6 4}
.wire{fill:none;stroke:var(--net);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wire-listen{fill:none;stroke:var(--listen);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wire-think{fill:none;stroke:var(--think);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wire-speak{fill:none;stroke:var(--speak);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wire-cancel{fill:none;stroke:var(--danger);stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect class="bg" x="0.5" y="0.5" width="1079" height="527" rx="16"/>
<text class="h1" x="32" y="48">Trust boundaries in a live voice call</text>
<text class="sub" x="32" y="76">Treat transcripts, Caller ID and retrieved documents as untrusted input; enforce permissions in deterministic server code.</text>

<!-- Zone 1: Untrusted -->
<rect class="b-danger" x="32" y="104" width="316" height="358" rx="12"/>
<text class="eyebrow c-danger" x="52" y="132">UNTRUSTED CALLER &amp; NETWORK</text>

<rect class="card" x="52" y="148" width="276" height="68" rx="10"/>
<text class="title" x="68" y="174">Spoken &amp; background audio</text>
<text class="small" x="68" y="198">Prompt injection, nearby voices, replay</text>

<rect class="card" x="52" y="228" width="276" height="68" rx="10"/>
<text class="title" x="68" y="254">Caller ID, SIP headers &amp; DTMF</text>
<text class="small" x="68" y="278">ANI/From can be spoofed; validate digits</text>

<rect class="card" x="52" y="308" width="276" height="68" rx="10"/>
<text class="title" x="68" y="334">RAG docs &amp; webhook payloads</text>
<text class="small" x="68" y="358">Indirect instructions inside fetched text</text>

<text class="mono c-danger" x="52" y="416">Never treat ANI or voice match</text>
<text class="mono c-danger" x="52" y="438">alone as strong authentication.</text>

<!-- Zone 2: Ephemeral Session & Model -->
<rect class="card" x="384" y="104" width="296" height="358" rx="12"/>
<text class="eyebrow c-think" x="404" y="132">SESSION EDGE &amp; MODEL</text>

<rect class="subcard" x="404" y="148" width="256" height="86" rx="10"/>
<text class="title" x="420" y="174">Short-lived client token</text>
<text class="small" x="420" y="198">Mint per-call WebRTC / WS token;</text>
<text class="small" x="420" y="218">keep provider API keys on server.</text>

<rect class="b-think" x="404" y="250" width="256" height="106" rx="10"/>
<text class="title" x="420" y="278">Voice LLM / S2S model</text>
<text class="small" x="420" y="302">Reasons over untrusted transcript</text>
<text class="small" x="420" y="322">and proposes a structured</text>
<text class="mono" x="420" y="342">tool_call(name, args)</text>

<text class="small" x="404" y="396">System prompts reduce mistakes</text>
<text class="small" x="404" y="416">but are NOT an access-control</text>
<text class="small" x="404" y="436">boundary.</text>

<!-- Zone 3: Trusted Server Policy Gate -->
<rect class="card" x="716" y="104" width="332" height="358" rx="12"/>
<rect class="b-listen" x="732" y="120" width="6" height="326" rx="3"/>
<text class="eyebrow c-listen" x="752" y="134">TRUSTED SERVER POLICY GATE</text>

<rect class="subcard" x="752" y="150" width="276" height="68" rx="10"/>
<text class="title" x="768" y="176">1. Verified session identity</text>
<text class="small" x="768" y="200">Bind scope to verified caller, not prompt</text>

<rect class="subcard" x="752" y="230" width="276" height="68" rx="10"/>
<text class="title" x="768" y="256">2. Allowlists &amp; spend caps</text>
<text class="small" x="768" y="280">Destination rules, concurrency &amp; budgets</text>

<rect class="b-listen" x="752" y="310" width="276" height="74" rx="10"/>
<text class="title" x="768" y="336">3. Explicit confirmation gate</text>
<text class="small" x="768" y="360">Read back target + amount before</text>
<text class="small" x="768" y="376">refunds, bookings, dials or transfers</text>

<text class="mono c-listen" x="752" y="418">4. Redact PII/PCI in logs &amp; traces</text>
<text class="small" x="752" y="440">Scrub tokens, cards and audio URLs</text>

<!-- Arrows between zones -->
<path class="wire" d="M348 182H378" marker-end="url(#arr-n)"/>
<path class="wire" d="M348 262H378" marker-end="url(#arr-n)"/>
<path class="wire" d="M348 342H378" marker-end="url(#arr-n)"/>
<path class="wire-listen" d="M680 302H710" marker-end="url(#arr-g)"/>

<text class="foot" x="32" y="498">Verify webhook signatures (Twilio, Telnyx, Stripe, LiveKit) on your server before updating call or business state.</text>
</svg>
