<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 556" width="1080" height="556" role="img" aria-labelledby="t d">
<title id="t">Echo is removed where the sound is played</title>
<desc id="d">Two panels. On the caller's device, the microphone feeds capture processing, which does echo cancellation, noise suppression and gain. The device's playback audio goes to the speaker and, as a timed copy called the echo reference, into capture processing. Sound from the speaker also leaks back into the microphone through the room. Processed audio crosses the network to the agent server, where optional enhancement feeds voice activity detection and the speech model. The echo reference is not sent to the server automatically, so a server-side filter cannot replace echo cancellation on the device.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--listen:#0b7a53;--listen-t:#dff3ea;--speak:#b3441a;--speak-t:#fbe9e0;--warn:#8a5c00;--warn-t:#fff8c5}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--listen:#2fb784;--listen-t:#12301f;--speak:#ec7a45;--speak-t:#3a2014;--warn:#d29922;--warn-t:#2e2508}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.h2{font-size:20px;font-weight:700}
.name{font-size:16px;font-weight:600}.desc{font-size:15px;fill:var(--ink2)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.lbl{font-weight:700;fill:var(--ink)}
.flow{fill:none;stroke:var(--ink2);stroke-width:2}.ref{fill:none;stroke:var(--speak);stroke-width:3}
.dash{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5}
.ah{fill:var(--ink2)}.ahw{fill:var(--warn)}.ahs{fill:var(--speak)}
.net{fill:var(--net)}.t-net{fill:var(--net-t)}.s-net{stroke:var(--net)}
.n-listen{fill:var(--listen-t);stroke:var(--listen);stroke-width:1.5}.n-speak{fill:var(--speak-t);stroke:var(--speak);stroke-width:1.5}
.opt{stroke-dasharray:6 4}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tag{fill:var(--card);stroke:var(--line)}.tagw{fill:var(--warn-t);stroke:var(--warn)}.tags{fill:var(--card);stroke:var(--speak);stroke-width:1.5}
.x{fill:none;stroke:var(--warn);stroke-width:2;stroke-linecap:round}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahs"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="555" rx="16"/>
<text class="h1" x="32" y="50">Echo is removed where the sound is played</text>
<text class="sub" x="32" y="78">The device keeps a copy of what it plays and uses it to remove echo. The server does not receive that copy automatically.</text>

<!-- panel: caller's device -->
<rect class="card" x="32" y="112" width="536" height="392" rx="14"/>
<circle class="t-net" cx="70" cy="158" r="22"/>
<g class="ico s-net" transform="translate(58 146)"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g>
<text class="eyebrow net" x="104" y="152">CALLER'S DEVICE</text>
<text class="h2" x="104" y="175">Holds the reference</text>
<path d="M52 200H548" stroke="var(--line)"/>

<!-- panel: agent server -->
<rect class="card" x="728" y="112" width="320" height="392" rx="14"/>
<circle class="t-net" cx="766" cy="158" r="22"/>
<g class="ico s-net" transform="translate(754 146)"><rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/><path d="M7.5 7.5h.01M7.5 16.5h.01"/></g>
<text class="eyebrow net" x="800" y="152">AGENT SERVER</text>
<text class="h2" x="800" y="175">No reference by default</text>
<path d="M748 200H1028" stroke="var(--line)"/>

<!-- device, top row: what is captured -->
<rect class="n-listen" x="56" y="224" width="184" height="88" rx="12"/>
<text class="name" x="72" y="254">Microphone</text>
<text class="desc" x="72" y="276">Hears the caller</text>
<text class="desc" x="72" y="294">and the echo</text>

<rect class="n-listen" x="320" y="224" width="224" height="88" rx="12"/>
<text class="name" x="336" y="254">Capture processing</text>
<text class="desc" x="336" y="276">Echo cancellation (AEC),</text>
<text class="desc" x="336" y="294">noise suppression, gain</text>

<!-- device, bottom row: what is played -->
<rect class="n-speak" x="56" y="392" width="184" height="88" rx="12"/>
<text class="name" x="72" y="422">Speaker</text>
<text class="desc" x="72" y="444">Plays the agent's</text>
<text class="desc" x="72" y="462">voice into the room</text>

<rect class="n-speak" x="320" y="392" width="224" height="88" rx="12"/>
<text class="name" x="336" y="422">Playback audio</text>
<text class="desc" x="336" y="444">A timed copy of what</text>
<text class="desc" x="336" y="462">is being played</text>

<!-- server nodes -->
<rect class="n-listen opt" x="752" y="224" width="272" height="88" rx="12"/>
<text class="name" x="768" y="254">Server enhancement</text>
<rect class="tag" x="926" y="238" width="86" height="22" rx="11"/><text class="mono" x="969" y="254" text-anchor="middle">optional</text>
<text class="desc" x="768" y="276">Typically gets audio the</text>
<text class="desc" x="768" y="294">device already processed</text>

<rect class="n-listen" x="752" y="392" width="272" height="88" rx="12"/>
<text class="name" x="768" y="422">VAD + speech model</text>
<text class="desc" x="768" y="444">Quiet words must survive</text>
<text class="desc" x="768" y="462">the earlier stages</text>

<!-- flows -->
<path class="flow" d="M240 268H318" marker-end="url(#a)"/><text class="mono" x="279" y="258" text-anchor="middle">samples</text>
<path class="flow" d="M544 268H750" marker-end="url(#a)"/><text class="mono" x="648" y="258" text-anchor="middle">processed audio</text>
<path class="flow" d="M888 312V390" marker-end="url(#a)"/>
<path class="flow" d="M320 436H242" marker-end="url(#a)"/><text class="mono" x="281" y="426" text-anchor="middle">play</text>

<!-- the reference: copy of playback audio into capture processing -->
<path class="ref" d="M432 392V314" marker-end="url(#as)"/>
<rect class="tags" x="362" y="339" width="140" height="26" rx="13"/><text class="mono lbl" x="432" y="357" text-anchor="middle">echo reference</text>

<!-- the problem: sound leaks from speaker back into the microphone -->
<path class="dash" d="M148 392V314" marker-end="url(#aw)"/>
<rect class="tagw" x="66" y="339" width="164" height="26" rx="13"/><text class="mono lbl" x="148" y="357" text-anchor="middle">echo via the room</text>

<!-- the gap: the reference is not sent to the server automatically -->
<path class="dash" d="M544 436H634"/>
<circle cx="656" cy="436" r="11" fill="var(--card)" stroke="var(--warn)" stroke-width="2"/><path class="x" d="M651.5 431.5l9 9M660.5 431.5l-9 9"/>
<text class="mono lbl" x="648" y="472" text-anchor="middle">not sent</text>
<text class="mono lbl" x="648" y="490" text-anchor="middle">automatically</text>

<text class="desc" x="32" y="534">Conceptual model of one signal path. Devices, browsers and providers differ in what they process.</text>
</svg>
