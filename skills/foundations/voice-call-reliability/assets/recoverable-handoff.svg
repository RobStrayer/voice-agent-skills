<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 596" width="1080" height="596" role="img" aria-labelledby="t d">
<title id="t">A handoff succeeds before the bot leaves</title>
<desc id="d">A timeline of three call legs across six steps: explain the hold, reach the human, human accepts, connect, verify, retire. The caller leg stays connected the whole time. The bot leg stays on the call until both parties are confirmed live, then retires. The human leg rings, is accepted, then goes live with the caller. If any step is not confirmed, because the human was busy, declined, failed to connect, timed out or the outcome is unresolved, the caller is still connected and the agent uses a supported fallback: return to the agent, a bounded wait, contact details or a callback.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--think:#4a3aa7;--think-t:#eae8f8;--warn:#8a5c00;--warn-t:#fff8c5;--good:#1a7f37;--good-t:#dafbe1}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--think:#a29af0;--think-t:#262045;--warn:#d29922;--warn-t:#2e2508;--good:#3fb950;--good-t:#12301a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.h2{font-size:20px;font-weight:700}
.name{font-size:16px;font-weight:600}.desc{font-size:15px;fill:var(--ink2)}.bt{font-size:15px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.lbl{font-weight:700;fill:var(--ink)}.num{font-size:14px;font-weight:700;text-anchor:middle}
.dash{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5}.ahw{fill:var(--warn)}
.net{fill:var(--net)}.think{fill:var(--think)}.warn{fill:var(--warn)}
.t-net{fill:var(--net-t)}.t-think{fill:var(--think-t)}.t-warn{fill:var(--warn-t)}
.s-net{stroke:var(--net)}.s-good{stroke:var(--good)}.s-warn{stroke:var(--warn)}
.bar-net{fill:var(--net-t);stroke:var(--net);stroke-width:1.5}.bar-think{fill:var(--think-t);stroke:var(--think);stroke-width:1.5}
.bar-warn{fill:var(--warn-t);stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 4}.bar-good{fill:var(--good-t);stroke:var(--good);stroke-width:1.5}
.ghost{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.grid{stroke:var(--line);stroke-width:1}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{fill:var(--card);stroke:var(--line)}.chipw{fill:var(--warn-t);stroke:var(--warn)}
</style>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="595" rx="16"/>
<text class="h1" x="32" y="50">A handoff succeeds before the bot leaves</text>
<text class="sub" x="32" y="78">Keep the caller connected. Retire only the bot, and only once call state shows both parties are live.</text>

<!-- timeline card -->
<rect class="card" x="32" y="108" width="1016" height="312" rx="14"/>

<!-- step headers -->
<text class="eyebrow net" x="56" y="146">CALL LEGS</text>
<circle class="t-net" cx="224" cy="140" r="13"/><text class="num" x="224" y="145">1</text><text class="name" x="246" y="146">Explain</text>
<text class="desc" x="211" y="172">Bot explains</text><text class="desc" x="211" y="190">the hold</text>
<circle class="t-net" cx="364" cy="140" r="13"/><text class="num" x="364" y="145">2</text><text class="name" x="386" y="146">Reach</text>
<text class="desc" x="351" y="172">Request a leg</text><text class="desc" x="351" y="190">to the human</text>
<circle class="t-net" cx="504" cy="140" r="13"/><text class="num" x="504" y="145">3</text><text class="name" x="526" y="146">Accept</text>
<text class="desc" x="491" y="172">Human accepts.</text><text class="desc" x="491" y="190">Pass context.</text>
<circle class="t-net" cx="644" cy="140" r="13"/><text class="num" x="644" y="145">4</text><text class="name" x="666" y="146">Connect</text>
<text class="desc" x="631" y="172">Join caller</text><text class="desc" x="631" y="190">and human</text>
<circle class="t-net" cx="784" cy="140" r="13"/><text class="num" x="784" y="145">5</text><text class="name" x="806" y="146">Verify</text>
<text class="desc" x="771" y="172">Call state shows</text><text class="desc" x="771" y="190">both live</text>
<circle class="t-net" cx="924" cy="140" r="13"/><text class="num" x="924" y="145">6</text><text class="name" x="946" y="146">Retire</text>
<text class="desc" x="911" y="172">Only the bot</text><text class="desc" x="911" y="190">leaves</text>
<path class="grid" d="M56 206H1024"/>
<path class="grid" d="M340 108V380M480 108V380M620 108V380M760 108V380M900 108V380"/>

<!-- lane labels -->
<circle class="t-net" cx="68" cy="236" r="16"/>
<g class="ico s-net" transform="translate(56 224)"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 7 0 0 1 16 0"/></g>
<text class="name" x="94" y="242">Caller leg</text>
<circle class="t-think" cx="68" cy="298" r="16"/>
<path class="think" transform="translate(56 286)" d="M12 2.5l2 7.5 7.5 2-7.5 2-2 7.5-2-7.5-7.5-2 7.5-2z"/>
<text class="name" x="94" y="304">Bot leg</text>
<circle class="t-net" cx="68" cy="360" r="16"/>
<g class="ico s-net" transform="translate(56 348)"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19v.5a2.5 2.5 0 0 1-2.5 2.5H13"/></g>
<text class="name" x="94" y="366">Human leg</text>

<!-- caller leg: never dropped -->
<rect class="bar-net" x="208" y="219" width="832" height="34" rx="9"/>
<text class="bt" x="224" y="241">Stays connected the whole time</text>

<!-- bot leg: leaves last, after verification -->
<rect class="bar-think" x="208" y="281" width="684" height="34" rx="9"/>
<text class="bt" x="224" y="303">Stays on the call until both parties are confirmed live</text>
<rect class="ghost" x="908" y="281" width="132" height="34" rx="9"/>
<text class="desc" x="974" y="303" text-anchor="middle">Retired</text>

<!-- human leg: ringing is not connected -->
<rect class="bar-warn" x="348" y="343" width="124" height="34" rx="9"/>
<text class="bt" x="410" y="365" text-anchor="middle">Ringing</text>
<rect class="bar-net" x="488" y="343" width="264" height="34" rx="9"/>
<text class="bt" x="620" y="365" text-anchor="middle">Accepted, joining the call</text>
<rect class="bar-good" x="768" y="343" width="272" height="34" rx="9"/>
<path class="ico s-good" d="M790 360.5l4 4 8-8.5"/>
<text class="bt" x="814" y="365">Live with the caller</text>

<!-- not confirmed: any step -->
<path class="dash" d="M346 398H1040M346 390V398M1040 390V398"/>
<rect class="chipw" x="587" y="385" width="212" height="26" rx="13"/><text class="mono lbl" x="693" y="403" text-anchor="middle">any step not confirmed</text>
<path class="dash" d="M693 411V450" marker-end="url(#aw)"/>

<!-- fallback card -->
<rect class="card" x="32" y="452" width="1016" height="96" rx="14"/>
<rect class="warn" x="32" y="452" width="1016" height="5" rx="2.5"/>
<circle class="t-warn" cx="70" cy="504" r="22"/>
<g class="ico s-warn" transform="translate(58 492)"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></g>
<text class="eyebrow warn" x="104" y="498">NOT CONFIRMED</text>
<text class="h2" x="104" y="522">Stay with the caller</text>
<text class="desc" x="352" y="492">Busy, declined, connection failed, timed out or unresolved.</text>
<text class="desc" x="352" y="527">Fall back to</text>
<rect class="chip" x="446" y="508" width="162" height="28" rx="14"/><text class="bt" x="527" y="527" text-anchor="middle">Return to the agent</text>
<rect class="chip" x="616" y="508" width="118" height="28" rx="14"/><text class="bt" x="675" y="527" text-anchor="middle">Bounded wait</text>
<rect class="chip" x="742" y="508" width="136" height="28" rx="14"/><text class="bt" x="810" y="527" text-anchor="middle">Contact details</text>
<rect class="chip" x="886" y="508" width="92" height="28" rx="14"/><text class="bt" x="932" y="527" text-anchor="middle">Callback</text>

<text class="desc" x="32" y="576">Dashed outline: not yet confirmed. A conceptual policy, not a provider event sequence.</text>
</svg>
