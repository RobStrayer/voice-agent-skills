<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="recoverable-handoff-title recoverable-handoff-desc" id="recoverable-handoff-root"><title id="recoverable-handoff-title">A handoff succeeds before the bot leaves</title><desc id="recoverable-handoff-desc">The controller preserves the caller leg through human acceptance and verified connection, retires only the bot, and applies fallback when observed call state does not confirm a successful handoff.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #recoverable-handoff-root { --paper:#b9beb8; --paper-2:#d2d6cf; --ink:#202823; --strong:#18201c; --muted:#3e4a42; --soft:#414e44; --rule:rgba(32,40,35,.18); --rule-solid:#8e9b90; --accent:#2d6358; --accent-tint:#c9d9cf; --link:#3f5f54; }
      #recoverable-handoff-root { color: var(--ink); font-family: 'Geist',system-ui,sans-serif; }
      #recoverable-handoff-root .diagram-container { width:100%; overflow-x:auto; }
      #recoverable-handoff-root .diagram-container { overflow-x:visible; }
      #recoverable-handoff-root .figure-title { font-family:'Instrument Serif',Georgia,serif; font-size:28px; font-weight:400; fill:var(--strong); }
      #recoverable-handoff-root .node-name { font-family:'Geist',system-ui,sans-serif; font-size:12px; font-weight:600; fill:var(--ink); }
      #recoverable-handoff-root .sub { font-family:'Geist Mono',ui-monospace,monospace; font-size:9px; fill:var(--muted); }
      #recoverable-handoff-root .label { font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; letter-spacing:.04em; fill:var(--soft); }
      #recoverable-handoff-root .meta { font-family:'Geist Mono',ui-monospace,monospace; font-size:8px; fill:var(--muted); }</style><marker id="recoverable-handoff-rh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3e4a42"/></marker><marker id="recoverable-handoff-rh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d6358"/></marker><marker id="recoverable-handoff-rh-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f5f54"/></marker></defs><rect width="960" height="600" fill="#b9beb8"/><text x="40" y="68" class="figure-title" text-anchor="start">A handoff succeeds before the bot leaves</text><text x="920" y="64" class="meta" text-anchor="end">REVIEWED 2026-09-30 UTC</text><text x="40" y="88" class="sub" text-anchor="start">CONCEPTUAL POLICY: retain caller; retire only bot. Failure state may have no destination reply.</text><line x1="160" y1="164" x2="160" y2="540" stroke="#8e9b90" stroke-width="1" stroke-dasharray="3,3"/><line x1="480" y1="164" x2="480" y2="540" stroke="#8e9b90" stroke-width="1" stroke-dasharray="3,3"/><line x1="800" y1="164" x2="800" y2="540" stroke="#8e9b90" stroke-width="1" stroke-dasharray="3,3"/><g data-message="HUMAN PLEASE"><line x1="160" y1="184" x2="480" y2="184" stroke="#3e4a42" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="284" y="160" width="72" height="16" rx="2" fill="#b9beb8"/><text x="320" y="172" class="label" text-anchor="middle">HUMAN PLEASE</text></g><g data-message="EXPLAIN HOLD"><line x1="480" y1="216" x2="160" y2="216" stroke="#3e4a42" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="284" y="192" width="72" height="16" rx="2" fill="#b9beb8"/><text x="320" y="204" class="label" text-anchor="middle">EXPLAIN HOLD</text></g><g data-message="REQUEST LEG"><line x1="480" y1="248" x2="800" y2="248" stroke="#3f5f54" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow-link)"/><rect x="606" y="224" width="68" height="16" rx="2" fill="#b9beb8"/><text x="640" y="236" class="label" text-anchor="middle">REQUEST LEG</text></g><rect x="112" y="264" width="736" height="276" rx="4" fill="#202823" fill-opacity=".02" stroke="#8e9b90"/><rect x="112" y="264" width="40" height="16" rx="2" fill="#b9beb8" stroke="#8e9b90"/><text x="132" y="276" class="label" text-anchor="middle">ALT</text><text x="172" y="280" class="meta" text-anchor="start">[accepted; connect and verify]</text><g data-message="ACCEPTED"><line x1="800" y1="304" x2="480" y2="304" stroke="#3e4a42" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="610" y="280" width="60" height="16" rx="2" fill="#b9beb8"/><text x="640" y="292" class="label" text-anchor="middle">ACCEPTED</text></g><g data-message="PASS CONTEXT"><line x1="480" y1="336" x2="800" y2="336" stroke="#3e4a42" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="604" y="312" width="72" height="16" rx="2" fill="#b9beb8"/><text x="640" y="324" class="label" text-anchor="middle">PASS CONTEXT</text></g><g data-message="CONNECT"><line x1="480" y1="368" x2="160" y2="368" stroke="#3e4a42" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="290" y="344" width="60" height="16" rx="2" fill="#b9beb8"/><text x="320" y="356" class="label" text-anchor="middle">CONNECT</text></g><g data-message="PARTIES LIVE"><line x1="800" y1="392" x2="480" y2="392" stroke="#2d6358" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recoverable-handoff-rh-arrow-accent)"/><rect x="604" y="368" width="72" height="16" rx="2" fill="#b9beb8"/><text x="640" y="380" class="label" text-anchor="middle">PARTIES LIVE</text></g><g data-message="RETIRE BOT"><path d="M 480 416 H 512 Q 520 416 520 424 Q 520 432 512 432 H 480" fill="none" stroke="#3e4a42" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="528" y="416" width="64" height="16" rx="2" fill="#b9beb8"/><text x="560" y="428" class="label" text-anchor="middle">RETIRE BOT</text></g><line x1="120" y1="448" x2="840" y2="448" stroke="#8e9b90" stroke-dasharray="4,3"/><text x="172" y="464" class="meta" text-anchor="start">[busy, declined, connection failed, timeout, or unresolved]</text><g data-message="NOT CONFIRMED"><path d="M 480 488 H 512 Q 520 488 520 496 Q 520 504 512 504 H 480" fill="none" stroke="#3e4a42" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="528" y="488" width="80" height="16" rx="2" fill="#b9beb8"/><text x="568" y="500" class="label" text-anchor="middle">NOT CONFIRMED</text></g><g data-message="USE FALLBACK"><line x1="480" y1="528" x2="160" y2="528" stroke="#3e4a42" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recoverable-handoff-rh-arrow)"/><rect x="284" y="504" width="72" height="16" rx="2" fill="#b9beb8"/><text x="320" y="516" class="label" text-anchor="middle">USE FALLBACK</text></g><g data-actor="Caller leg"><rect x="80" y="108" width="160" height="56" rx="6" fill="#b9beb8"/><rect x="80" y="108" width="160" height="56" rx="6" fill="#d2d6cf" stroke="#8e9b90"/><text x="96" y="123" class="meta" text-anchor="start">CALLER</text><text x="160" y="139" class="node-name" text-anchor="middle">Caller leg</text><text x="160" y="155" class="sub" text-anchor="middle">preserve connection</text></g><g data-actor="Call controller"><rect x="400" y="108" width="160" height="56" rx="6" fill="#b9beb8"/><rect x="400" y="108" width="160" height="56" rx="6" fill="#d2d6cf" stroke="#8e9b90"/><text x="416" y="123" class="meta" text-anchor="start">APPLICATION</text><text x="480" y="139" class="node-name" text-anchor="middle">Call controller</text><text x="480" y="155" class="sub" text-anchor="middle">handoff state</text></g><g data-actor="Human destination"><rect x="720" y="108" width="160" height="56" rx="6" fill="#b9beb8"/><rect x="720" y="108" width="160" height="56" rx="6" fill="#d2d6cf" stroke="#8e9b90"/><text x="736" y="123" class="meta" text-anchor="start">RECIPIENT</text><text x="800" y="139" class="node-name" text-anchor="middle">Human destination</text><text x="800" y="155" class="sub" text-anchor="middle">acceptance + connection</text></g><line x1="40" y1="548" x2="920" y2="548" stroke="#8e9b90" stroke-width=".8"/><line x1="40" y1="560" x2="64" y2="560" stroke="#3e4a42" stroke-width="1.2" marker-end="url(#recoverable-handoff-rh-arrow)"/><text x="76" y="563" class="meta" text-anchor="start">REQUEST / CONTROL</text><line x1="244" y1="560" x2="268" y2="560" stroke="#3e4a42" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#recoverable-handoff-rh-arrow)"/><text x="280" y="563" class="meta" text-anchor="start">RETURN / EVIDENCE</text><text x="920" y="563" class="meta" text-anchor="end">CONCEPTUAL POLICY, NOT PROVIDER EVENTS</text></svg>
