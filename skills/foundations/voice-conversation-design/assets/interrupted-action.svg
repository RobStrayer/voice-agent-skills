<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 592" width="1080" height="592" role="img" aria-labelledby="t d">
<title id="t">Stopping speech does not stop the booking</title>
<desc id="d">A timeline with three events and three lanes. First, the caller authorizes Tuesday: booking action B7 is sent and spoken reply R4, "Working on Tuesday", starts playing. Second, the caller says "Thursday instead": R4 is stopped and cleared, but B7 keeps running at the booking API and its outcome is not yet known. The turn controller's ledger keeps B7 as pending and records Thursday as the latest intent, separately. Third, B7's result arrives late, reporting that Tuesday was committed. It updates B7's record only. The controller must reconcile B7 before writing the Thursday change.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--think:#4a3aa7;--think-t:#eae8f8;--speak:#b3441a;--speak-t:#fbe9e0;--warn:#8a5c00;--warn-t:#fff8c5;--good:#1a7f37;--good-t:#dafbe1}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--think:#a29af0;--think-t:#262045;--speak:#ec7a45;--speak-t:#3a2014;--warn:#d29922;--warn-t:#2e2508;--good:#3fb950;--good-t:#12301a}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.h2{font-size:20px;font-weight:700}
.name{font-size:16px;font-weight:600}.desc{font-size:15px;fill:var(--ink2)}.bt{font-size:15px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.num{font-size:14px;font-weight:700;text-anchor:middle}
.flow{fill:none;stroke:var(--ink2);stroke-width:2}.ah{fill:var(--ink2)}
.mk{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5}.mk2{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.think{fill:var(--think)}.speak{fill:var(--speak)}.net{fill:var(--net)}.warn{fill:var(--warn)}
.t-net{fill:var(--net-t)}.t-think{fill:var(--think-t)}.t-speak{fill:var(--speak-t)}
.s-net{stroke:var(--net)}.s-speak{stroke:var(--speak)}.s-good{stroke:var(--good)}.s-think{stroke:var(--think)}
.bar-speak{fill:var(--speak-t);stroke:var(--speak);stroke-width:1.5}.bar-think{fill:var(--think-t);stroke:var(--think);stroke-width:1.5}
.bar-warn{fill:var(--warn-t);stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 4}.bar-good{fill:var(--good-t);stroke:var(--good);stroke-width:1.5}
.grid{stroke:var(--line);stroke-width:1}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="591" rx="16"/>
<text class="h1" x="32" y="50">Stopping speech does not stop the booking</text>
<text class="sub" x="32" y="78">The caller books Tuesday, then says Thursday instead. B7 is the booking action. R4 is the spoken reply.</text>

<!-- timeline card -->
<rect class="card" x="32" y="108" width="1016" height="340" rx="14"/>

<!-- event markers sit behind the bars -->
<path class="mk" d="M507 108V446"/>
<path class="mk2" d="M773 108V446"/>

<!-- event headers -->
<circle class="t-net" cx="262" cy="138" r="13"/><text class="num" x="262" y="143">1</text><text class="name" x="284" y="144">Tuesday authorized</text>
<text class="desc" x="251" y="170">B7 is sent.</text><text class="desc" x="251" y="188">R4 starts playing.</text>
<circle class="t-net" cx="529" cy="138" r="13"/><text class="num" x="529" y="143">2</text><text class="name" x="551" y="144">Caller corrects</text>
<text class="desc" x="518" y="170">“Thursday instead.”</text><text class="desc" x="518" y="188">R4 is stopped and cleared.</text>
<circle class="t-net" cx="795" cy="138" r="13"/><text class="num" x="795" y="143">3</text><text class="name" x="817" y="144">B7 result arrives</text>
<text class="desc" x="784" y="170">Late. Tuesday was</text><text class="desc" x="784" y="188">committed.</text>
<path class="grid" d="M56 204H1024"/>

<!-- lane labels -->
<circle class="t-speak" cx="66" cy="236" r="16"/>
<g class="ico s-speak" transform="translate(54 224)"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g>
<text class="name" x="92" y="236">Playback</text><text class="desc" x="92" y="256">what is heard</text>
<circle class="t-net" cx="66" cy="300" r="16"/>
<g class="ico s-net" transform="translate(54 288)"><rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/><path d="M7.5 7.5h.01M7.5 16.5h.01"/></g>
<text class="name" x="92" y="300">Booking API</text><text class="desc" x="92" y="320">business system</text>
<circle class="t-think" cx="66" cy="387" r="16"/>
<path class="think" transform="translate(54 375)" d="M12 2.5l2 7.5 7.5 2-7.5 2-2 7.5-2-7.5-7.5-2 7.5-2z"/>
<text class="name" x="92" y="387">Turn controller</text><text class="desc" x="92" y="407">keeps the ledger</text>

<!-- playback: R4 is cut off -->
<rect class="bar-speak" x="248" y="219" width="287" height="34" rx="9"/>
<text class="bt" x="264" y="241">R4 · “Working on Tuesday…”</text>
<rect class="warn" x="549" y="230" width="12" height="12" rx="2"/>
<text class="bt" x="569" y="241">Stopped and cleared</text>

<!-- booking API: B7 keeps going -->
<rect class="bar-warn" x="248" y="283" width="509" height="34" rx="9"/>
<text class="bt" x="264" y="305">B7 · booking Tuesday, outcome not yet known</text>
<rect class="bar-good" x="781" y="283" width="259" height="34" rx="9"/>
<path class="ico s-good" d="M799 300.5l4 4 8-8.5"/>
<text class="bt" x="823" y="305">Tuesday committed</text>
<path class="flow" d="M850 317V344" marker-end="url(#a)"/>
<text class="mono" x="864" y="336">updates B7’s record</text>

<!-- controller ledger: two separate records -->
<rect class="bar-warn" x="248" y="346" width="509" height="34" rx="9"/>
<text class="bt" x="264" y="368">B7 · pending</text>
<rect class="bar-good" x="781" y="346" width="259" height="34" rx="9"/>
<path class="ico s-good" d="M799 363.5l4 4 8-8.5"/>
<text class="bt" x="823" y="368">B7 · committed</text>
<rect class="bar-think" x="248" y="394" width="251" height="34" rx="9"/>
<text class="bt" x="264" y="416">Intent · Tuesday</text>
<rect class="bar-think" x="515" y="394" width="525" height="34" rx="9"/>
<text class="bt" x="531" y="416">Intent · Thursday (latest), kept apart from B7</text>

<!-- rule -->
<rect class="card" x="32" y="470" width="1016" height="72" rx="14"/>
<rect class="think" x="32" y="470" width="1016" height="5" rx="2.5"/>
<circle class="t-think" cx="70" cy="512" r="22"/>
<g class="ico s-think" transform="translate(58 500)"><path d="M12 20V11M12 11L6 5M12 11l6-6M6 5h4M6 5v4M18 5h-4M18 5v4"/></g>
<text class="h2" x="104" y="505">A stopped sentence is not a canceled booking.</text>
<text class="desc" x="104" y="528">Keep B7 and the Thursday intent separate. Reconcile B7 before writing Thursday.</text>

<text class="desc" x="32" y="572">Conceptual example, not a provider event sequence.</text>
</svg>
