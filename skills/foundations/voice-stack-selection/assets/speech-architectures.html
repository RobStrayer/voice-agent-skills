  <style>
* { box-sizing:border-box; }
:root { --paper:#b9beb8; --paper-2:#d2d6cf; --ink:#202823; --muted:#3e4a42; --soft:#414e44; --rule:#8e9b90; --accent:#2d6358; --tint:#c9d9cf; }
body { margin:0; padding:24px; background:var(--paper); color:var(--ink); font-family:'Geist',Arial,sans-serif; }
main { max-width:1040px; min-width:0; margin:auto; }
.diagram-container { width:100%; overflow-x:auto; }
svg { width:100%; min-width:960px; height:auto; display:block; }
text { fill:var(--ink); }
.title { font:400 40px 'Instrument Serif',Georgia,serif; }
.node-name { font:600 16px 'Geist',Arial,sans-serif; }
.row-title { font:600 14px 'Geist',Arial,sans-serif; }

.note { font:400 11px 'Geist',Arial,sans-serif; fill:var(--muted); }
.meta { font:500 8px 'Geist Mono',Consolas,monospace; letter-spacing:1.4px; fill:var(--soft); }
@media print { body { padding:0; } .diagram-container { overflow-x:visible; } svg { min-width:0; } }

  <title id="speech-architectures-title">Where does the conversation happen?</title>
  <desc id="speech-architectures-desc">Three conceptual voice paths: speech-to-text, text agent and text-to-speech; a single speech model session; and a spoken interface delegating work to a backend and receiving results. Incoming and outgoing audio cross each path boundary. These paths do not rank latency or specify transport, authorization or durable records.</desc>

  <text x="40" y="44" class="meta" >ARCHITECTURE / THREE COMMON PATTERNS</text>
<text x="40" y="96" class="title" >Where does the conversation happen?</text>
<text x="40" y="126" class="sub" >The speech path changes. Application ownership still matters.</text>
