<text class="name" x="350" y="314">One speech model session</text><text class="desc" x="350" y="334">Audio interpretation, reasoning, tools and speech</text>
<path class="flow" d="M974 300H1020" marker-end="url(#a)"/><text class="mono" x="998" y="290" text-anchor="middle">audio</text>
<path class="rule" d="M56 368H1024"/>

<!-- row 3: a spoken interface delegates work -->
<text class="h2" x="56" y="430">Delegated</text>
<text class="desc" x="56" y="454">Keep your existing</text><text class="desc" x="56" y="472">backend workflow</text>
<path class="flow" d="M286 416H332" marker-end="url(#a)"/><text class="mono" x="310" y="406" text-anchor="middle">audio</text>
