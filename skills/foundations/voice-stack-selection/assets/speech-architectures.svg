<rect class="listen" x="334" y="388" width="132" height="5" rx="2.5"/><rect class="speak" x="470" y="388" width="128" height="5" rx="2.5"/>
<circle class="t-listen" cx="366" cy="420" r="16"/><g class="ico s-listen" transform="translate(356 410) scale(.85)"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
