<circle class="t-speak" cx="830" cy="148" r="16"/><g class="ico s-speak" transform="translate(820 138) scale(.85)"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g>
<text class="eyebrow speak" x="856" y="153">SPEAK</text>
<text class="name" x="814" y="178">Text-to-speech</text><text class="desc" x="814" y="198">synthesis</text>
<path class="flow" d="M974 164H1020" marker-end="url(#a)"/><text class="mono" x="998" y="154" text-anchor="middle">audio</text>
<path class="rule" d="M56 232H1024"/>

<!-- row 2: one session does all three jobs -->
<text class="h2" x="56" y="294">Speech-to-speech</text>
<text class="desc" x="56" y="318">No text step before</text><text class="desc" x="56" y="336">each answer</text>
<path class="flow" d="M286 300H332" marker-end="url(#a)"/><text class="mono" x="310" y="290" text-anchor="middle">audio</text>
<rect class="card" x="334" y="252" width="640" height="96" rx="12"/>
<rect class="listen" x="334" y="252" width="210" height="5" rx="2.5"/><rect class="think" x="548" y="252" width="212" height="5" rx="2.5"/><rect class="speak" x="764" y="252" width="210" height="5" rx="2.5"/>
<circle class="t-listen" cx="366" cy="284" r="16"/><g class="ico s-listen" transform="translate(356 274) scale(.85)"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
