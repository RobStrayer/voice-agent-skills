<text class="eyebrow think" x="624" y="153">THINK</text>
<text class="name" x="582" y="178">Text agent</text><text class="desc" x="582" y="198">reasoning + tools</text>
<path class="flow" d="M742 164H796" marker-end="url(#a)"/><text class="mono" x="769" y="154" text-anchor="middle">text</text>
