<circle class="t-think" cx="580" cy="284" r="16"/><path class="think" transform="translate(570 274) scale(.85)" d="M12 2.5l2 7.5 7.5 2-7.5 2-2 7.5-2-7.5-7.5-2 7.5-2z"/>
<text class="eyebrow think" x="606" y="289">THINK</text>
<circle class="t-speak" cx="796" cy="284" r="16"/><g class="ico s-speak" transform="translate(786 274) scale(.85)"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g>
