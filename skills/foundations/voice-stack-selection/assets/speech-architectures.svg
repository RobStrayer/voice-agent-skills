<text class="eyebrow listen" x="392" y="153">LISTEN</text>
<text class="name" x="350" y="178">Speech-to-text</text><text class="desc" x="350" y="198">recognition</text>
<path class="flow" d="M510 164H564" marker-end="url(#a)"/><text class="mono" x="537" y="154" text-anchor="middle">text</text>
