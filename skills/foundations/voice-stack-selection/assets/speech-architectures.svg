<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 552" width="1080" height="552" role="img" aria-labelledby="t d">
<title id="t">Where does the conversation happen?</title>
<desc id="d">Three common speech paths, one per row. Chained: audio goes into speech-to-text (listen), the text goes to a text agent that reasons and uses tools (think), and its text goes to text-to-speech (speak), which produces audio. Text is available between the stages. Speech-to-speech: audio goes into one speech model session that does all three jobs, listening, thinking and speaking, and audio comes out. Delegated: audio goes both ways through a spoken interface that listens and speaks; it sends work to a backend workflow, which holds the existing reasoning and tools, and receives results back. The figure does not rank latency or specify transport, permissions or durable records.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--listen:#0b7a53;--listen-x:#0e8659;--listen-t:#dff3ea;--think:#4a3aa7;--think-t:#eae8f8;--speak:#b3441a;--speak-t:#fbe9e0}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--listen:#2fb784;--listen-x:#2fb784;--listen-t:#12301f;--think:#a29af0;--think-t:#262045;--speak:#ec7a45;--speak-t:#3a2014}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.h2{font-size:20px;font-weight:700}
.name{font-size:16px;font-weight:600}.desc{font-size:15px;fill:var(--ink2)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.flow{fill:none;stroke:var(--ink2);stroke-width:2}.dashn{fill:none;stroke:var(--ink2);stroke-width:2;stroke-dasharray:6 5}.ah{fill:var(--ink2)}
.listen{fill:var(--listen)}.think{fill:var(--think)}.speak{fill:var(--speak)}
.eyebrow.listen{fill:var(--listen-x)}
.s-listen{stroke:var(--listen)}.s-speak{stroke:var(--speak)}
.t-listen{fill:var(--listen-t)}.t-think{fill:var(--think-t)}.t-speak{fill:var(--speak-t)}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rule{stroke:var(--line);stroke-width:1}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="551" rx="16"/>
<text class="h1" x="32" y="50">Where does the conversation happen?</text>
<text class="sub" x="32" y="78">Three common speech paths. The path changes; your application still owns turns, actions and records.</text>

<!-- row 1: chained, text between the stages -->
<text class="h2" x="56" y="158">Chained</text>
<text class="desc" x="56" y="182">Inspect or reuse the text</text><text class="desc" x="56" y="200">between stages</text>
