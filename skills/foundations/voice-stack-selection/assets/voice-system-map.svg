<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 566" width="1080" height="566" role="img" aria-labelledby="t d">
<title id="t">One conversation, several owners</title>
<desc id="d">Three paths, each with its own owner and its own evidence. Call control, at the top: a call controller routes, transfers and ends calls, sends control to the media transport and receives call state back. Its evidence is call state. Audio path, in the middle: capture feeds transport, which feeds the voice runtime, which feeds playback. Its evidence is played audio. Business actions, at the bottom: the voice runtime sends an action to the action service, which authorizes and reconciles it, commits to business records, and returns a result to the runtime. Its evidence is the committed record.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--listen:#0b7a53;--think:#4a3aa7;--speak:#b3441a}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--listen:#2fb784;--think:#a29af0;--speak:#ec7a45}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}
.name{font-size:16px;font-weight:600}.desc{font-size:15px;fill:var(--ink2)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.flow{fill:none;stroke:var(--ink2);stroke-width:2}.dashn{fill:none;stroke:var(--ink2);stroke-width:2;stroke-dasharray:6 5}.ah{fill:var(--ink2)}
.listen{fill:var(--listen)}.think{fill:var(--think)}.speak{fill:var(--speak)}.net{fill:var(--net)}
.band{fill:var(--net-t);stroke:var(--line)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="565" rx="16"/>
<text class="h1" x="32" y="50">One conversation, several owners</text>
<text class="sub" x="32" y="78">Audio, call control and business actions each have their own owner and their own evidence.</text>

<!-- lane: call control -->
<rect class="band" x="32" y="110" width="1016" height="116" rx="14"/>
<text class="eyebrow net" x="48" y="142">CALL</text><text class="eyebrow net" x="48" y="160">CONTROL</text>
<text class="desc" x="48" y="182">Evidence</text><text class="name" x="48" y="202">Call state</text>
<rect class="card" x="432" y="124" width="176" height="88" rx="12"/><rect class="net" x="432" y="124" width="176" height="5" rx="2.5"/>
<text class="name" x="448" y="158">Call controller</text><text class="desc" x="448" y="181">Route, transfer,</text><text class="desc" x="448" y="199">end calls</text>

<!-- lane: audio path -->
<rect class="band" x="32" y="254" width="1016" height="116" rx="14"/>
<text class="eyebrow net" x="48" y="286">AUDIO</text><text class="eyebrow net" x="48" y="304">PATH</text>
<text class="desc" x="48" y="326">Evidence</text><text class="name" x="48" y="346">Played audio</text>
<rect class="card" x="216" y="268" width="176" height="88" rx="12"/><rect class="listen" x="216" y="268" width="176" height="5" rx="2.5"/>
<text class="name" x="232" y="302">Capture</text><text class="desc" x="232" y="325">Device audio</text><text class="desc" x="232" y="343">processing</text>
<path class="flow" d="M394 312H430" marker-end="url(#a)"/>
<rect class="card" x="432" y="268" width="176" height="88" rx="12"/><rect class="net" x="432" y="268" width="176" height="5" rx="2.5"/>
<text class="name" x="448" y="302">Transport</text><text class="desc" x="448" y="325">Codec and</text><text class="desc" x="448" y="343">media path</text>
<path class="flow" d="M610 312H646" marker-end="url(#a)"/>
<rect class="card" x="648" y="268" width="176" height="88" rx="12"/><rect class="think" x="648" y="268" width="176" height="5" rx="2.5"/>
<text class="name" x="664" y="302">Voice runtime</text><text class="desc" x="664" y="325">Turns, model,</text><text class="desc" x="664" y="343">tools</text>
<path class="flow" d="M826 312H862" marker-end="url(#a)"/>
<rect class="card" x="864" y="268" width="176" height="88" rx="12"/><rect class="speak" x="864" y="268" width="176" height="5" rx="2.5"/>
<text class="name" x="880" y="302">Playback</text><text class="desc" x="880" y="325">Queue and</text><text class="desc" x="880" y="343">device</text>

<!-- lane: business actions -->
<rect class="band" x="32" y="398" width="1016" height="116" rx="14"/>
<text class="eyebrow net" x="48" y="430">BUSINESS</text><text class="eyebrow net" x="48" y="448">ACTIONS</text>
<text class="desc" x="48" y="470">Evidence</text><text class="name" x="48" y="490">Committed record</text>
<rect class="card" x="648" y="412" width="176" height="88" rx="12"/><rect class="think" x="648" y="412" width="176" height="5" rx="2.5"/>
<text class="name" x="664" y="446">Action service</text><text class="desc" x="664" y="469">Authorize and</text><text class="desc" x="664" y="487">reconcile</text>
<path class="flow" d="M826 456H862" marker-end="url(#a)"/>
<rect class="card" x="864" y="412" width="176" height="88" rx="12"/><rect class="net" x="864" y="412" width="176" height="5" rx="2.5"/>
<text class="name" x="880" y="446">Business records</text><text class="desc" x="880" y="469">Authoritative</text><text class="desc" x="880" y="487">outcome</text>

<!-- links between lanes -->
<path class="flow" d="M506 214V266" marker-end="url(#a)"/><text class="mono" x="494" y="244" text-anchor="end">control</text>
<path class="dashn" d="M534 266V214" marker-end="url(#a)"/><text class="mono" x="546" y="244">call state</text>
<path class="flow" d="M722 358V410" marker-end="url(#a)"/><text class="mono" x="710" y="388" text-anchor="end">action</text>
<path class="dashn" d="M750 410V358" marker-end="url(#a)"/><text class="mono" x="762" y="388">result</text>

<text class="desc" x="32" y="542">Logical paths: output also travels through the media transport. Played speech and committed actions are different evidence.</text>
</svg>
