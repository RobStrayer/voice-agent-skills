<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turn controller | NL Voice Skills</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #b9beb8;
      --paper2: #d2d6cf;
      --ink: #202823;
      --strong: #18201c;
      --muted: #3e4a42;
      --soft: #414e44;
      --rule: rgba(32,40,35,.18);
      --rule-solid: #8e9b90;
      --accent: #2d6358;
      --accent-tint: #c9d9cf;
      --link: #3f5f54;
    }
    body { margin: 0; padding: 24px; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; }
    .frame { width: 100%; max-width: 960px; min-width: 0; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; height: auto; display: block; }
    .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; font-weight: 400; fill: #18201c; }
    .name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #18201c; }
    .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #3e4a42; }
    .tag { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #3e4a42; letter-spacing: 0.5px; }
    .edge-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; font-weight: 500; fill: #202823; text-anchor: middle; }
    .annotation { font-family: 'Geist', system-ui, sans-serif; font-size: 10px; font-weight: 400; fill: #3e4a42; }
    .source { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #3e4a42; }
    @media print {
      body { padding: 0; }
      .frame { max-width: none; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="diagram-container">
      <svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="turn-controller-title turn-controller-desc">
        <title id="turn-controller-title">A turn controller that can yield and safely resume</title>
        <desc id="turn-controller-desc">Four conceptual speaking states separate a possible end of turn from a committed response, yield to eligible interruptions, allow safe false-alarm recovery, and keep tool actions in an independent ledger.</desc>
        <defs>
          <marker id="turn-controller-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3e4a42"/></marker>
          <marker id="turn-controller-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2d6358"/></marker>
        </defs>
        <rect x="0" y="0" width="960" height="600" fill="#b9beb8"/>
        <text x="40" y="48" class="tag">NL VOICE SKILLS / TURN TAKING</text>
        <text x="40" y="80" class="title">Listen, commit, respond, yield</text>
        <text x="40" y="104" class="annotation">One controller commits user turns and releases assistant output.</text>

        <!-- Eight transitions, including the initial entry; connectors precede nodes. -->
        <g fill="none" stroke="#3e4a42" stroke-width="1.4" stroke-linejoin="round">
          <path id="turn-controller-initial-entry" d="M64 264 H96" marker-end="url(#turn-controller-arrow)"/>
          <path id="turn-controller-speech-stops" d="M280 264 H384" marker-end="url(#turn-controller-arrow)"/>
          <path id="turn-controller-caller-resumes" d="M432 228 V200 Q432 192 424 192 H240 Q232 192 232 200 V228" marker-end="url(#turn-controller-arrow)"/>
          <path id="turn-controller-completion-accepted" d="M568 264 H672" marker-end="url(#turn-controller-arrow)"/>
          <path id="turn-controller-response-finishes" d="M744 228 V156 Q744 148 736 148 H152 Q144 148 144 156 V228" marker-end="url(#turn-controller-arrow)"/>
          <path id="turn-controller-output-stopped" d="M384 440 H192 Q184 440 184 432 V300" marker-end="url(#turn-controller-arrow)"/>
          <path id="turn-controller-false-safe-resume" d="M568 440 H880 Q888 440 888 432 V288 Q888 280 880 280 H856" marker-end="url(#turn-controller-arrow)"/>
        </g>
        <path id="turn-controller-eligible-interruption" d="M744 300 V344 Q744 352 736 352 H524 Q516 352 516 360 V404" fill="none" stroke="#2d6358" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#turn-controller-arrow-accent)"/>

        <!-- Label masks have an 8px gap from the connector stroke. -->
        <g>
          <rect x="292" y="240" width="80" height="16" fill="#b9beb8"/>
          <text x="332" y="251" class="edge-label">SPEECH STOPS</text>
          <rect x="288" y="168" width="88" height="16" fill="#b9beb8"/>
          <text x="332" y="179" class="edge-label">CALLER RESUMES</text>
          <rect x="580" y="240" width="80" height="16" fill="#b9beb8"/>
          <text x="620" y="251" class="edge-label">TURN COMMIT</text>
          <rect x="408" y="124" width="64" height="16" fill="#b9beb8"/>
          <text x="440" y="135" class="edge-label">FINISHED</text>
          <rect x="584" y="328" width="96" height="16" fill="#b9beb8"/>
          <text x="632" y="339" class="edge-label">ELIGIBLE INPUT</text>
          <rect x="232" y="416" width="96" height="16" fill="#b9beb8"/>
          <text x="280" y="427" class="edge-label">OUTPUT STOPPED</text>
          <rect x="692" y="416" width="104" height="16" fill="#b9beb8"/>
          <text x="744" y="427" class="edge-label">FALSE + SAFE</text>
        </g>

        <circle cx="56" cy="264" r="6" fill="#202823"/>

        <g id="turn-controller-listening">
          <rect x="96" y="228" width="184" height="72" rx="8" fill="#d2d6cf" stroke="#8e9b90" stroke-width="1"/>
          <rect x="108" y="240" width="44" height="12" rx="2" fill="#b9beb8"/>
          <text x="114" y="249" class="tag">STATE</text>
          <text x="108" y="268" class="name">Listening</text>
          <text x="108" y="286" class="sub">capture user audio</text>
        </g>
        <g id="turn-controller-candidate-end">
          <rect x="384" y="228" width="184" height="72" rx="8" fill="#d2d6cf" stroke="#8e9b90" stroke-width="1"/>
          <rect x="396" y="240" width="44" height="12" rx="2" fill="#b9beb8"/>
          <text x="402" y="249" class="tag">STATE</text>
          <text x="396" y="268" class="name">CandidateEnd</text>
          <text x="396" y="286" class="sub">await completion evidence</text>
        </g>
        <g id="turn-controller-responding">
          <rect x="672" y="228" width="184" height="72" rx="8" fill="#d2d6cf" stroke="#8e9b90" stroke-width="1"/>
          <rect x="684" y="240" width="44" height="12" rx="2" fill="#b9beb8"/>
          <text x="690" y="249" class="tag">STATE</text>
          <text x="684" y="268" class="name">Responding</text>
          <text x="684" y="286" class="sub">generate and play output</text>
        </g>
        <g id="turn-controller-yielding">
          <rect x="384" y="404" width="184" height="72" rx="8" fill="#c9d9cf" stroke="#2d6358" stroke-width="1.5"/>
          <rect x="396" y="416" width="44" height="12" rx="2" fill="#b9beb8"/>
          <text x="402" y="425" class="tag">STATE</text>
          <text x="396" y="444" class="name">Yielding</text>
          <text x="396" y="462" class="sub">invalidate / stop old output</text>
        </g>

        <!-- The tool ledger is an annotation, not a fifth speaking state. -->
        <rect x="96" y="492" width="760" height="40" rx="6" fill="#b9beb8" stroke="#8e9b90" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="108" y="507" class="tag">SEPARATE ACTION LEDGER</text>
        <text x="108" y="523" class="annotation">Pending and committed tool actions persist independently. Stopped speech does not undo an external action.</text>

        <line x1="40" y1="536" x2="920" y2="536" stroke="#8e9b90" stroke-width="1"/>
        <text x="40" y="548" class="source">Conceptual engineering model / reviewed 2026-09-30 UTC</text>
        <text x="40" y="560" class="annotation">False-alarm resume requires a still-valid response and safe output recovery. Provider APIs differ.</text>
      </svg>
    </div>
  </main>
</body>
</html>
