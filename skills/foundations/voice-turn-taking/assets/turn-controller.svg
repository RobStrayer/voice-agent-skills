<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 624" width="1080" height="624" role="img" aria-labelledby="t d">
<title id="t">Listen, commit, respond, yield</title>
<desc id="d">A state diagram of one turn controller with four states, and a separate action ledger below it. Listening captures input, even while work is pending. When speech stops it moves to CandidateEnd, which holds a possible end of turn and waits for evidence. If the caller resumes, it returns to Listening. When the turn is committed it moves to Responding, which generates and plays output. When the response finishes it returns to Listening. An eligible interruption moves Responding to Yielding, which invalidates the old response and stops its output. When the output has stopped, Yielding returns to Listening. If the interruption was a false alarm and it is safe to resume, Yielding returns to Responding; that path needs a response that is still valid and safe output recovery. The action ledger is separate: pending and committed tool actions persist independently and can be pending in any state, so stopped speech does not undo an action.</desc>
<style>
svg{--bg:#f6f8fa;--card:#fff;--line:#d0d7de;--ink:#1f2328;--ink2:#59636e;--net:#57606a;--net-t:#eaeef2;--listen:#0b7a53;--listen-t:#dff3ea;--think:#4a3aa7;--think-t:#eae8f8;--speak:#b3441a;--speak-t:#fbe9e0;--warn:#8a5c00;--warn-t:#fff8c5}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--card:#161b22;--line:#30363d;--ink:#e6edf3;--ink2:#9198a1;--net:#8b949e;--net-t:#21262d;--listen:#2fb784;--listen-t:#12301f;--think:#a29af0;--think-t:#262045;--speak:#ec7a45;--speak-t:#3a2014;--warn:#d29922;--warn-t:#2e2508}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:var(--ink)}
.bg{fill:var(--bg);stroke:var(--line)}.card{fill:var(--card);stroke:var(--line)}.band{fill:var(--net-t);stroke:var(--line)}
.h1{font-size:27px;font-weight:700}.sub{font-size:16px;fill:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px}.h2{font-size:20px;font-weight:700}
.desc{font-size:15px;fill:var(--ink2)}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14px;fill:var(--ink2)}
.lbl{font-weight:700;fill:var(--ink)}
.flow{fill:none;stroke:var(--ink2);stroke-width:2}.dash{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:6 5}.ah{fill:var(--ink2)}.ahw{fill:var(--warn)}
.listen{fill:var(--listen)}.think{fill:var(--think)}.speak{fill:var(--speak)}.warn{fill:var(--warn)}.net{fill:var(--net)}
.t-listen{fill:var(--listen-t)}.t-think{fill:var(--think-t)}.t-speak{fill:var(--speak-t)}.t-warn{fill:var(--warn-t)}.t-net{fill:var(--net-t)}
.s-listen{stroke:var(--listen)}.s-think{stroke:var(--think)}.s-speak{stroke:var(--speak)}.s-warn{stroke:var(--warn)}.s-net{stroke:var(--net)}
.ico{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:var(--ink)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ahw"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1079" height="623" rx="16"/>
<text class="h1" x="32" y="50">Listen, commit, respond, yield</text>
<text class="sub" x="32" y="78">One controller commits the caller’s turn and releases the assistant’s output.</text>

<!-- the controller: four states -->
<rect class="band" x="32" y="108" width="1016" height="368" rx="14"/>
<text class="eyebrow net" x="48" y="134">TURN CONTROLLER</text>

<!-- transitions first, so the state cards sit on top of the line ends -->
<circle class="dot" cx="64" cy="220" r="6"/><path class="flow" d="M72 220H94" marker-end="url(#a)"/><text class="mono" x="64" y="244" text-anchor="middle">start</text>
<path class="flow" d="M304 202H454" marker-end="url(#a)"/><text class="mono" x="380" y="192" text-anchor="middle">speech stops</text>
<path class="flow" d="M456 238H306" marker-end="url(#a)"/><text class="mono" x="380" y="260" text-anchor="middle">caller resumes</text>
<path class="flow" d="M664 220H814" marker-end="url(#a)"/><text class="mono lbl" x="740" y="210" text-anchor="middle">turn committed</text>
<path class="flow" d="M920 168V154Q920 146 912 146H208Q200 146 200 154V166" marker-end="url(#a)"/><text class="mono" x="560" y="137" text-anchor="middle">response finishes</text>
<path class="flow" d="M968 272V420Q968 428 960 428H666" marker-end="url(#a)"/><text class="mono" x="813" y="450" text-anchor="middle">eligible interruption</text>
<path class="dash" d="M664 380H872Q880 380 880 372V274" marker-end="url(#aw)"/><text class="mono" x="768" y="352" text-anchor="middle">false alarm,</text><text class="mono" x="768" y="370" text-anchor="middle">safe to resume</text>
<path class="flow" d="M456 404H208Q200 404 200 396V274" marker-end="url(#a)"/><text class="mono" x="332" y="396" text-anchor="middle">output stopped</text>

<!-- Listening -->
<rect class="card" x="96" y="168" width="208" height="104" rx="12"/><rect class="listen" x="96" y="168" width="208" height="5" rx="2.5"/>
<circle class="t-listen" cx="128" cy="202" r="16"/><g class="ico s-listen" transform="translate(118 192) scale(.85)"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></g>
<text class="h2" x="154" y="209">Listening</text>
<text class="desc" x="112" y="240">Capture input, even</text><text class="desc" x="112" y="258">while work is pending</text>

<!-- CandidateEnd -->
<rect class="card" x="456" y="168" width="208" height="104" rx="12"/><rect class="think" x="456" y="168" width="208" height="5" rx="2.5"/>
<circle class="t-think" cx="488" cy="202" r="16"/><g class="ico s-think" transform="translate(478 192) scale(.85)"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></g>
<text class="h2" x="514" y="209">CandidateEnd</text>
<text class="desc" x="472" y="240">Hold a possible end,</text><text class="desc" x="472" y="258">wait for evidence</text>

<!-- Responding -->
<rect class="card" x="816" y="168" width="208" height="104" rx="12"/><rect class="speak" x="816" y="168" width="208" height="5" rx="2.5"/>
<circle class="t-speak" cx="848" cy="202" r="16"/><g class="ico s-speak" transform="translate(838 192) scale(.85)"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></g>
<text class="h2" x="874" y="209">Responding</text>
<text class="desc" x="832" y="240">Generate and play</text><text class="desc" x="832" y="258">output (can overlap)</text>

<!-- Yielding -->
<rect class="card" x="456" y="352" width="208" height="104" rx="12"/><rect class="warn" x="456" y="352" width="208" height="5" rx="2.5"/>
<circle class="t-warn" cx="488" cy="386" r="16"/><g class="ico s-warn" transform="translate(478 376) scale(.85)"><rect x="5.5" y="5.5" width="13" height="13" rx="2.5"/></g>
<text class="h2" x="514" y="393">Yielding</text>
<text class="desc" x="472" y="424">Invalidate the old</text><text class="desc" x="472" y="442">response, stop output</text>

<!-- the ledger: outside the controller -->
<rect class="card" x="32" y="500" width="1016" height="76" rx="14"/><rect class="net" x="32" y="500" width="1016" height="5" rx="2.5"/>
<circle class="t-net" cx="70" cy="540" r="22"/><g class="ico s-net" transform="translate(58 528)"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8.5h6M9 12h6M9 15.5h4"/></g>
<text class="eyebrow net" x="104" y="530">SEPARATE ACTION LEDGER</text>
<text class="h2" x="104" y="556">Stopped speech does not undo an action.</text>
<text class="desc" x="600" y="531">Pending and committed tool actions</text><text class="desc" x="600" y="551">persist independently, in any state.</text>

<text class="desc" x="32" y="606">Dashed: resume only if the response is still valid and output recovery is safe. Conceptual model; provider APIs differ.</text>
</svg>
